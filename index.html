/* ---------- charts ---------- */
// Weekly GMV for the last `weeks` weeks. One series, so one hue and no legend;
// every bar carries a tooltip and the orders table is the tabular view.
function admWeeklyChart(weeks){
  const now = Date.now(), buckets = [];
  for(let i=weeks-1;i>=0;i--){
    const end = now - i*7*ADM_DAY, start = end - 7*ADM_DAY;
    const list = STORE.orders.filter(o=>{ const t=new Date(o.date).getTime(); return admCounts(o) && t>start && t<=end; });
    buckets.push({start, gmv:admSum(list,o=>o.price), n:list.length});
  }
  const max = Math.max(1, ...buckets.map(b=>b.gmv));
  const step = max<=2000 ? 500 : max<=5000 ? 1000 : 2000;
  const top = Math.ceil(max/step)*step;
  const ticks = [top, top/2, 0];
  const fmt = v => 'R$ '+Number(v).toLocaleString('pt-BR');
  const peak = buckets.reduce((a,b)=> b.gmv>a.gmv?b:a, buckets[0]);
  const lbl = t => new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return `<div class="adm-chart" role="img" aria-label="GMV por semana nas últimas ${weeks} semanas. Maior semana: ${fmt(peak.gmv)}.">
    <div class="adm-yaxis">${ticks.map(t=>`<span>${fmt(t)}</span>`).join('')}</div>
    <div class="adm-plot">
      <div class="adm-grid"><i></i><i></i><i></i></div>
      <div class="adm-bars">${buckets.map(b=>`
        <div class="adm-col" tabindex="0">
          <div class="adm-tip"><b>${fmt(b.gmv)}</b>${b.n} pedido${b.n===1?'':'s'} · semana de ${lbl(b.start)}</div>
          ${b===peak && b.gmv ? `<span class="adm-val" style="bottom:calc(${(b.gmv/top*100).toFixed(1)}% + 6px)">${fmt(b.gmv)}</span>` : ''}
          <div class="adm-bar${b.gmv?'':' zero'}" style="height:${(b.gmv/top*100).toFixed(1)}%"></div>
        </div>`).join('')}
      </div>
      <div class="adm-xaxis">${buckets.map((b,i)=>`<span>${i%2===(weeks-1)%2 ? lbl(b.start) : ''}</span>`).join('')}</div>
    </div>
  </div>`;
}
function admHBars(rows, unit){
  const max = Math.max(1, ...rows.map(r=>r.n));
  return `<div class="adm-hbars">${rows.map(r=>`
    <div class="adm-hrow"><span class="adm-hlabel">${r.label}</span>
      <span class="adm-htrack"><span class="adm-hfill" style="width:${(r.n/max*100).toFixed(1)}%"></span></span>
      <span class="adm-hval mono">${r.n}${unit||''}</span></div>`).join('')}</div>`;
}
function admMeter(part, total, labelA, labelB){
  const pa = admPct(part,total);
  return `<div class="adm-meter" role="img" aria-label="${labelA}: ${part} de ${total}">
    <div class="adm-meter-bar"><span style="width:${pa}%"></span></div>
    <div class="adm-meter-legend"><span><i class="a"></i>${labelA} <b class="mono">${part}</b> · ${pa}%</span><span><i class="b"></i>${labelB} <b class="mono">${total-part}</b> · ${100-pa}%</span></div>
  </div>`;
}

/* ============================================================
   ADMIN: VISÃO GERAL
   ============================================================ */
function viewAdminOverview(params){
  const period = params.get('p')||'30';
  const days = period==='all' ? 0 : Number(period);
  const orders = admOrdersSince(days).filter(admCounts);
  const gmv = admSum(orders, o=>o.price), fees = admSum(orders, admFee);
  const products = STORE.products, live = products.filter(p=>p.status==='ativo');
  const people = admPeople();
  const cut = days ? Date.now()-days*ADM_DAY : 0;
  const newUsers = people.filter(u=> new Date(u.joined).getTime() >= cut).length;
  const newListings = products.filter(p=> p.status!=='rascunho' && new Date(p.createdAt).getTime() >= cut).length;
  const held = STORE.orders.filter(admHeld);
  const periodLabel = days ? 'nos últimos '+days+' dias' : 'desde o início';

  // work queue
  const disputes = STORE.orders.filter(o=>o.orderStatus==='em_disputa');
  const failed = STORE.orders.filter(o=>o.orderStatus==='problema_entrega');
  const late = STORE.orders.filter(o=>o.orderStatus==='aguardando_envio' && admDays(o.date, new Date())>=2);
  const reports = admOpenReports();
  const unanswered = admUnanswered().filter(x=>x.days>=2);
  const stale = live.filter(p=>admListedDays(p)>60);
  const queue = [
    disputes.length && {n:disputes.length, tone:'danger', label:'disputa'+(disputes.length>1?'s':'')+' aguardando decisão', href:'#/admin/moderacao'},
    failed.length && {n:failed.length, tone:'danger', label:'pedido'+(failed.length>1?'s':'')+' com problema na entrega', href:'#/admin/pedidos?status=problema'},
    reports.length && {n:reports.length, tone:'warn', label:'denúncia'+(reports.length>1?'s':'')+' de anúncio para analisar', href:'#/admin/moderacao'},
    late.length && {n:late.length, tone:'warn', label:'pedido'+(late.length>1?'s':'')+' pago'+(late.length>1?'s':'')+' há 2 dias ou mais sem envio', href:'#/admin/pedidos?status=aberto'},
    unanswered.length && {n:unanswered.length, tone:'muted', label:'pergunta'+(unanswered.length>1?'s':'')+' sem resposta há mais de 48h', href:'#/admin/moderacao'},
    stale.length && {n:stale.length, tone:'muted', label:'anúncio'+(stale.length>1?'s':'')+' ativo'+(stale.length>1?'s':'')+' há mais de 60 dias', href:'#/admin/anuncios?idade=60'},
  ].filter(Boolean);

  const recent = STORE.orders.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0,5);

  return adminShell('geral','Visão geral', `
    <div class="adm-bar-top">
      <p class="adm-lede">Números do marketplace ${periodLabel}.</p>
      ${admChips('#/admin', new URLSearchParams({p:period}), 'p', [['7','7 dias'],['30','30 dias'],['90','90 dias'],['all','Tudo']])}
    </div>
    <div class="stat-row adm-kpis">
      ${admTile(money(gmv), 'GMV', 'Valor dos itens vendidos, sem frete')}
      ${admTile(orders.length, 'Pedidos', orders.length ? 'Ticket médio '+money(gmv/orders.length) : 'Nenhum no período')}
      ${admTile(money(fees), 'Receita de comissão', (STORE.settings.feeRate*100).toLocaleString('pt-BR')+'% sobre o item')}
      ${admTile(live.length, 'Anúncios ativos', newListings+' publicado'+(newListings===1?'':'s')+' no período')}
      ${admTile(people.length, 'Usuários', newUsers+' novo'+(newUsers===1?'':'s')+' no período')}
      ${admTile(money(admSum(held, admPaid)), 'Em custódia', held.length+' pedido'+(held.length===1?'':'s')+' ainda não liberado'+(held.length===1?'':'s'))}
    </div>

    <div class="adm-cols">
      <div class="card card-pad">
        <div class="adm-card-head"><h3>GMV por semana</h3><span>últimas 10 semanas</span></div>
        ${admWeeklyChart(10)}
      </div>
      <div class="card card-pad">
        <div class="adm-card-head"><h3>Precisa de atenção</h3><span>${queue.length ? admSum(queue,x=>x.n)+' itens' : 'fila vazia'}</span></div>
        ${queue.length ? `<ul class="adm-queue">${queue.map(x=>`<li><a href="${x.href}"><b class="mono adm-q-${x.tone}">${x.n}</b><span>${x.label}</span>${icon('chevronRight')}</a></li>`).join('')}</ul>`
          : `<p style="font-size:13.5px;color:var(--color-ink-muted)">Nada pendente: sem disputas, denúncias ou entregas com problema.</p>`}
      </div>
    </div>

    <div class="adm-card-head" style="margin-top:30px"><h3>Pedidos mais recentes</h3><a href="#/admin/pedidos" class="adm-more">Ver todos ${icon('arrowRight')}</a></div>
    ${admOrdersTable(recent)}
  `);
}

   ADMIN: PEDIDOS

function admOrdersTable(list){
  return admTable(
    [{label:'Pedido'},{label:'Data'},{label:'Item'},{label:'Comprador'},{label:'Vendedor'},{label:'Total pago',num:1},{label:'Comissão',num:1},{label:'Status'}],
    list.map(o=>{
      const p = productById(o.productId), b = sellerById(o.buyerId), s = sellerById(o.sellerId);
      return `<tr data-nav="#/admin/pedidos/${o.id}" tabindex="0" role="link" aria-label="Abrir pedido ${o.id}">

function viewAdminListings(params){

  const minAge = Number(params.get('idade')||0);
  const all = STORE.products;
  const published = all.filter(p=>p.status!=='rascunho');
  const live = all.filter(p=>p.status==='ativo');
  const sold = all.filter(p=>p.status==='vendido');
  const liveAges = live.map(admListedDays), soldAges = sold.map(admListedDays);
  const newLive = live.filter(admIsNew).length;
  const cntS = s => all.filter(p=>p.status===s).length;
  const buckets = [['Até 7 dias',0,7],['8 a 15 dias',8,15],['16 a 30 dias',16,30],['31 a 60 dias',31,60],['Mais de 60 dias',61,1e9]]
    .map(([label,a,b])=>({label, n:liveAges.filter(d=>d>=a && d<=b).length}));
  const sellThrough = admPct(sold.length, sold.length + live.length + cntS('pausado'));

  const list = all.filter(p=> (!status || p.status===status) && (!cat || p.category===cat)
      && (!cond || (cond==='novo') === admIsNew(p)) && (!minAge || (p.status==='ativo' && admListedDays(p)>minAge)))
    .filter(p=>{ const s=sellerById(p.sellerId); return admMatch(q, p.id, p.brand, p.model, p.type, s&&s.name); })
    .sort((a,b)=> admListedDays(b)-admListedDays(a));

    <div class="stat-row adm-kpis">
      ${admTile(live.length, 'Ativos', money(admSum(live,p=>p.price))+' em vitrine')}
      ${admTile(cntS('pausado'), 'Pausados')}
      ${admTile(cntS('rascunho'), 'Rascunhos')}
      ${admTile(sold.length, 'Vendidos', 'Taxa de venda '+sellThrough+'%')}
      ${admTile(admMedian(liveAges)+' d', 'Mediana anunciado', 'Entre os anúncios ativos')}
      ${admTile(admMedian(soldAges)+' d', 'Mediana até vender', 'Da publicação até a compra')}

    <div class="adm-cols">
      <div class="card card-pad">
        <div class="adm-card-head"><h3>Há quanto tempo estão anunciados</h3><span>${live.length} ativos</span></div>
        ${admHBars(buckets)}
      </div>
      <div class="card card-pad">
        <div class="adm-card-head"><h3>Novos e usados</h3><span>anúncios ativos</span></div>
        ${admMeter(newLive, live.length, 'Novos', 'Usados')}
        <div class="adm-card-head" style="margin-top:22px"><h3>Por categoria</h3><span>anúncios ativos</span></div>
        ${admHBars(['taco','bola','sapato'].map(c=>({label:ADM_CAT_LABEL[c], n:live.filter(p=>p.category===c).length})))}
      </div>
    </div>

    <div class="adm-filters" style="margin-top:30px">
      ${admChips('#/admin/anuncios', params, 'status', [['','Todos',all.length],['ativo','Ativos',cntS('ativo')],['pausado','Pausados',cntS('pausado')],['rascunho','Rascunhos',cntS('rascunho')],['vendido','Vendidos',cntS('vendido')],['cancelado','Removidos',cntS('cancelado')]])}
      ${admSearch('#/admin/anuncios', params, 'Buscar por marca, modelo, código ou vendedor')}
    </div>
    <div class="adm-filters">
      ${admChips('#/admin/anuncios', params, 'cat', [['','Todas as categorias'],['taco','Tacos'],['bola','Bolas'],['sapato','Sapatos']])}
      ${admChips('#/admin/anuncios', params, 'cond', [['','Novos e usados'],['novo','Só novos',published.filter(admIsNew).length],['usado','Só usados',published.filter(p=>!admIsNew(p)).length]])}
      ${admChips('#/admin/anuncios', params, 'idade', [['','Qualquer idade'],['30','Ativos há mais de 30 dias'],['60','Há mais de 60 dias']])}
    </div>
    <p class="adm-count"><b class="mono">${list.length}</b> anúncio${list.length===1?'':'s'} · <b class="mono">${money(admSum(list,p=>p.price))}</b> em preço pedido</p>
    ${admTable(
      [{label:'Anúncio'},{label:'Vendedor'},{label:'Condição'},{label:'Preço',num:1},{label:'Status'},{label:'Dias anunciado',num:1},{label:'Ações'}],
      list.map(p=>{
        const s = sellerById(p.sellerId), d = admListedDays(p);

          <td class="num mono">${money(p.price)}</td>
          <td>${admListingPill(p)}</td>
          <td class="num mono">${p.status==='rascunho'?'—':d}<small class="adm-cellsub">${p.status==='vendido'?'até vender · ':''}desde ${new Date(p.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</small></td>
          <td class="adm-actions">
            ${p.status==='ativo' ? `<button class="btn btn-ghost btn-xs" data-action="admin-listing-status" data-id="${p.id}" data-status="pausado">Pausar</button>` : ''}

        </tr>`;
      }), 'Nenhum anúncio com esses filtros.')}
  `);

function viewAdminUsers(params){

    vendedores: x=>x.st.listings.length>0,

          <h4 style="padding:0 0 12px">Ações</h4>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-outline btn-sm" data-action="admin-user-verify" data-id="${u.id}">${u.verified?'Remover verificação':'Marcar como verificado'}</button>
            ${u.status==='suspenso'
              ? `<button class="btn btn-primary btn-sm" data-action="admin-user-reactivate" data-id="${u.id}">Reativar conta</button>`
              : `<button class="btn btn-danger-outline btn-sm" data-action="admin-user-suspend" data-id="${u.id}">Suspender conta</button>`}
            <a class="btn btn-ghost btn-sm" href="#/loja/${u.id}">Ver perfil público</a>
          </div>
          <p style="font-size:12px;color:var(--color-ink-faint);margin-top:12px">Suspender bloqueia o login e pausa os anúncios ativos da conta.</p>
        </div>`}
      </aside>
    </div>
  `, [{href:'#/admin',label:'Admin'},{href:'#/admin/usuarios',label:'Usuários'},{label:escapeHtml(u.name)}]);
}

/* ============================================================
   ADMIN: MODERAÇÃO
   ============================================================ */
function viewAdminModeration(){
  const issues = admOpenDisputes().sort((a,b)=>a.date.localeCompare(b.date));
  const open = admOpenReports(), closed = STORE.reports.filter(r=>r.status!=='aberta');
  const unanswered = admUnanswered();
  const reportCard = (r, done) => {
    const p = productById(r.productId), rep = sellerById(r.reporterId), s = p && sellerById(p.sellerId);
    return `<div class="card card-pad adm-report">
      <div class="adm-report-top">
        ${p ? `<a href="#/produto/${p.id}">${admItemCell(p)}</a>` : admItemCell(null)}
        <span class="pill ${done?'pill-neutral':'pill-paused'}">${done ? (r.resolution==='anuncio_removido'?'Anúncio removido':'Arquivada') : 'Aberta'}</span>
      </div>
      <p><b>${escapeHtml(r.reason)}</b> · <span style="color:var(--color-ink-muted)">${r.id} · ${timeAgo(r.date)}</span></p>
      <p style="color:var(--color-ink-muted);margin-top:4px">“${escapeHtml(r.text)}”</p>
      <p style="font-size:12.5px;color:var(--color-ink-muted);margin-top:8px">Denunciado por ${rep?escapeHtml(rep.name):'—'}${s?` · vendedor <a href="#/admin/usuarios/${s.id}" style="text-decoration:underline">${escapeHtml(s.name)}</a>`:''}</p>
      ${done ? '' : `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn btn-danger-outline btn-sm" data-action="admin-report-resolve" data-id="${r.id}" data-outcome="anuncio_removido">Remover anúncio</button>
        <button class="btn btn-ghost btn-sm" data-action="admin-report-resolve" data-id="${r.id}" data-outcome="arquivada">Arquivar sem ação</button>
      </div>`}
    </div>`;
  };
  return adminShell('moderacao','Moderação', `
    <div class="adm-card-head"><h3>Disputas e entregas com problema</h3><span>${issues.length} em aberto</span></div>
    ${issues.length ? admTable([{label:'Pedido'},{label:'Aberto há'},{label:'Motivo'},{label:'Comprador'},{label:'Vendedor'},{label:'Valor em jogo',num:1},{label:'Status'}],
      issues.map(o=>{ const b=sellerById(o.buyerId), s=sellerById(o.sellerId);
        const since = o.dispute ? o.dispute.openedAt : ((o.trackingHistory||[]).slice(-1)[0]||{}).at || o.date;
        return `<tr data-nav="#/admin/pedidos/${o.id}" tabindex="0" role="link"><td class="mono"><b>${o.id}</b></td><td class="nowrap">${admDays(since,new Date())} dias</td>
          <td>${escapeHtml(o.dispute ? o.dispute.reason : (o.trackingRaw||'Falha na entrega'))}</td><td>${b?escapeHtml(b.name):'—'}</td><td>${s?escapeHtml(s.name):'—'}</td>
          <td class="num mono">${money(admPaid(o))}</td><td>${orderPill(o)}</td></tr>`; }))
      : `<p class="adm-nothing">Nenhuma disputa ou entrega com problema em aberto.</p>`}

    <div class="adm-card-head" style="margin-top:30px"><h3>Denúncias de anúncios</h3><span>${open.length} em aberto</span></div>
    ${open.length ? `<div class="adm-report-grid">${open.map(r=>reportCard(r,false)).join('')}</div>` : `<p class="adm-nothing">Nenhuma denúncia aguardando análise.</p>`}

    <div class="adm-card-head" style="margin-top:30px"><h3>Perguntas sem resposta</h3><span>${unanswered.length} no total</span></div>
    ${unanswered.length ? admTable([{label:'Anúncio'},{label:'Pergunta'},{label:'Vendedor'},{label:'Esperando há',num:1}],
      unanswered.map(({q,p,days})=>{ const s=sellerById(p.sellerId); return `<tr><td><a href="#/produto/${p.id}">${admItemCell(p)}</a></td><td>${escapeHtml(q.text)}<small class="adm-cellsub">${escapeHtml(q.buyer)}</small></td>
        <td><a href="#/admin/usuarios/${p.sellerId}">${s?escapeHtml(s.name):'—'}</a></td><td class="num mono">${days} d</td></tr>`; }))
      : `<p class="adm-nothing">Todas as perguntas foram respondidas.</p>`}

    ${closed.length ? `<div class="adm-card-head" style="margin-top:30px"><h3>Denúncias encerradas</h3><span>${closed.length}</span></div>
      <div class="adm-report-grid">${closed.map(r=>reportCard(r,true)).join('')}</div>` : ''}
  `);
}

/* ============================================================
   ADMIN: FINANCEIRO
   ============================================================ */
function viewAdminFinance(){
  const orders = STORE.orders.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const valid = orders.filter(admCounts), held = orders.filter(admHeld);
  const done = orders.filter(o=>o.orderStatus==='concluido'), refunded = orders.filter(o=>o.orderStatus==='reembolsado');
  const bySeller = {};
  valid.forEach(o=>{ const k=o.sellerId; bySeller[k] = bySeller[k] || {n:0, gmv:0, fee:0, paid:0, held:0};
    bySeller[k].n++; bySeller[k].gmv+=o.price; bySeller[k].fee+=admFee(o);
    if(o.orderStatus==='concluido') bySeller[k].paid+=admPayout(o); else bySeller[k].held+=admPayout(o); });
  const state = o => o.orderStatus==='concluido' ? '<span class="pill pill-sold">Liberado</span>' : o.orderStatus==='reembolsado' ? '<span class="pill pill-cancelled">Reembolsado</span>'
    : o.orderStatus==='em_disputa' ? '<span class="pill pill-cancelled">Bloqueado</span>' : '<span class="pill pill-paused">Em custódia</span>';
  return adminShell('financeiro','Financeiro', `
    <div class="stat-row adm-kpis">
      ${admTile(money(admSum(valid,o=>o.price)), 'GMV', valid.length+' pedidos, sem frete')}
      ${admTile(money(admSum(valid, admFee)), 'Comissão', 'Receita da plataforma')}
      ${admTile(money(admSum(valid,o=>o.freight)), 'Frete cobrado', 'Repassado ao vendedor')}
      ${admTile(money(admSum(held, admPaid)), 'Em custódia', held.length+' pedido'+(held.length===1?'':'s'))}
      ${admTile(money(admSum(done, admPayout)), 'Repassado', done.length+' pedido'+(done.length===1?'':'s')+' liberado'+(done.length===1?'':'s'))}
      ${admTile(money(admSum(refunded, admPaid)), 'Reembolsado', refunded.length+' pedido'+(refunded.length===1?'':'s'))}
    </div>
    <div class="card card-pad" style="margin-bottom:26px">
      <div class="adm-card-head"><h3>Comissão da plataforma</h3><span>valor de exemplo neste protótipo</span></div>
      <form data-form="admin-fee" class="adm-fee">
        <label for="adm-fee">Percentual sobre o preço do item</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input class="input mono" id="adm-fee" name="fee" type="number" min="0" max="30" step="0.5" value="${(STORE.settings.feeRate*100)}" style="width:110px" required>
          <span>%</span>
          <button class="btn btn-outline btn-sm" type="submit">Salvar</button>
        </div>
        <p>Vale para pedidos novos. Pedidos já feitos mantêm o percentual do momento da compra.</p>
      </form>
    </div>
    <div class="adm-card-head"><h3>Repasses por vendedor</h3></div>
    ${admTable([{label:'Vendedor'},{label:'Pedidos',num:1},{label:'GMV',num:1},{label:'Comissão',num:1},{label:'Já repassado',num:1},{label:'A repassar',num:1}],
      Object.keys(bySeller).sort((a,b)=>bySeller[b].gmv-bySeller[a].gmv).map(k=>{ const s=sellerById(k), v=bySeller[k];
        return `<tr data-nav="#/admin/usuarios/${k}" tabindex="0" role="link"><td>${admUserCell(s)}</td><td class="num mono">${v.n}</td><td class="num mono">${money(v.gmv)}</td><td class="num mono">${money(v.fee)}</td><td class="num mono">${money(v.paid)}</td><td class="num mono">${money(v.held)}</td></tr>`; }))}
    <div class="adm-card-head" style="margin-top:26px"><h3>Repasses por pedido</h3></div>
    ${admTable([{label:'Pedido'},{label:'Data'},{label:'Vendedor'},{label:'Item',num:1},{label:'Frete',num:1},{label:'Comissão',num:1},{label:'Repasse',num:1},{label:'Situação'}],
      orders.map(o=>{ const s=sellerById(o.sellerId); return `<tr data-nav="#/admin/pedidos/${o.id}" tabindex="0" role="link"><td class="mono"><b>${o.id}</b></td><td class="nowrap">${fmtDate(o.date)}</td><td>${s?escapeHtml(s.name):'—'}</td>
        <td class="num mono">${money(o.price)}</td><td class="num mono">${money(o.freight)}</td><td class="num mono">${money(admFee(o))}</td><td class="num mono">${money(admPayout(o))}</td><td>${state(o)}</td></tr>`; }))}
  `);
}

/* ============================================================
   ADMIN: AUDITORIA
   ============================================================ */
function viewAdminAudit(){
  const log = STORE.adminLog;
  const target = e => e.targetType==='pedido' ? `<a href="#/admin/pedidos/${e.targetId}" style="text-decoration:underline">${e.targetId}</a>`
    : e.targetType==='usuario' ? `<a href="#/admin/usuarios/${e.targetId}" style="text-decoration:underline">${escapeHtml((sellerById(e.targetId)||{}).name||e.targetId)}</a>`
    : e.targetType==='anuncio' ? (()=>{ const p=productById(e.targetId); return p ? `<a href="#/produto/${p.id}" style="text-decoration:underline">${escapeHtml(p.brand+' '+p.model)}</a>` : e.targetId; })()
    : escapeHtml(e.targetId||'');
  return adminShell('auditoria','Auditoria', `
    <p class="adm-lede" style="margin-bottom:18px">Toda ação feita no painel fica registrada aqui, com quem fez e quando. O registro não pode ser editado.</p>
    ${admTable([{label:'Quando'},{label:'Administrador'},{label:'Ação'},{label:'Alvo'},{label:'Detalhe'}],
      log.map(e=>`<tr><td class="mono nowrap">${new Date(e.at).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
        <td>${escapeHtml((sellerById(e.adminId)||{}).name||e.adminId)}</td><td><b>${ADM_LOG_LABEL[e.action]||e.action}</b></td><td>${target(e)}</td><td>${escapeHtml(e.detail)}</td></tr>`),
      'Nenhuma ação registrada ainda. Pause um anúncio ou decida uma disputa e ela aparece aqui.')}
  `);
}

/* ============================================================
   ADMIN: ações e formulários
   ============================================================ */
function admGuard(){ if(!isAdmin()){ toast('Ação restrita a administradores.'); return false; } return true; }
function admRemoveListing(p, reason){
  p.status = 'cancelado'; p.removedByAdmin = true; p.removedReason = reason; p.removedAt = new Date().toISOString();
}
Object.assign(ACTIONS, {
  'admin-listing-status'(el){
    if(!admGuard()) return;
    const p = productById(el.dataset.id); if(!p) return;
    p.status = el.dataset.status;
    admLog(p.status==='ativo'?'anuncio.reativar':'anuncio.pausar', 'anuncio', p.id, p.brand+' '+p.model);
    saveState(); toast(p.status==='ativo'?'Anúncio reativado.':'Anúncio pausado.'); render();
  },
  'admin-listing-remove'(el){
    if(!admGuard()) return;
    const p = productById(el.dataset.id); if(!p) return;
    openModal(`<h3 style="font-size:20px;margin-bottom:6px;padding-right:30px">Remover anúncio</h3>
      <p style="font-size:14px;color:var(--color-ink-muted);margin-bottom:16px">${escapeHtml(p.brand+' '+p.model)} sai da vitrine e o vendedor é avisado do motivo.</p>
      <form data-form="admin-remove-listing" data-id="${p.id}">
        <div class="field"><label for="adm-reason">Motivo</label><select class="input" id="adm-reason" name="reason">${ADM_REMOVE_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
        <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">Cancelar</button><button class="btn btn-primary btn-sm" type="submit">Remover anúncio</button></div>
      </form>`);
  },
  'admin-user-verify'(el){
    if(!admGuard()) return;
    const u = STORE.users.find(x=>x.id===el.dataset.id); if(!u) return;
    u.verified = !u.verified;
    admLog(u.verified?'usuario.verificar':'usuario.desverificar', 'usuario', u.id);
    saveState(); toast(u.verified?'Usuário marcado como verificado.':'Verificação removida.'); render();
  },
  'admin-user-suspend'(el){
    if(!admGuard()) return;
    const u = STORE.users.find(x=>x.id===el.dataset.id); if(!u || u.role==='admin') return;
    const n = STORE.products.filter(p=>p.sellerId===u.id && p.status==='ativo').length;
    openModal(`<h3 style="font-size:20px;margin-bottom:6px;padding-right:30px">Suspender ${escapeHtml(u.name)}</h3>
      <p style="font-size:14px;color:var(--color-ink-muted);margin-bottom:16px">O login fica bloqueado${n?` e ${n} anúncio${n>1?'s':''} ativo${n>1?'s':''} ${n>1?'são pausados':'é pausado'}`:''}. Pedidos em andamento seguem até o fim.</p>
      <form data-form="admin-suspend-user" data-id="${u.id}">
        <div class="field"><label for="adm-sreason">Motivo</label><input class="input" id="adm-sreason" name="reason" type="text" placeholder="Ex.: denúncias confirmadas de anúncio falso" required></div>
        <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">Cancelar</button><button class="btn btn-primary btn-sm" type="submit">Suspender conta</button></div>
      </form>`);
  },
  'admin-user-reactivate'(el){
    if(!admGuard()) return;
    const u = STORE.users.find(x=>x.id===el.dataset.id); if(!u) return;
    u.status = 'ativo'; u.suspendedReason = null;
    admLog('usuario.reativar', 'usuario', u.id);
    saveState(); toast('Conta reativada. Os anúncios continuam pausados até o vendedor reativar.'); render();
  },
  'admin-order-release'(el){
    if(!admGuard()) return;
    const o = STORE.orders.find(x=>x.id===el.dataset.id); if(!o) return;
    confirmDialog('Liberar pagamento ao vendedor?', `O repasse de ${money(admPayout(o))} do pedido ${o.id} é liberado agora e o pedido é concluído.`, 'Liberar pagamento', 'admin-order-release-confirm', `data-id="${o.id}"`);
  },
  'admin-order-release-confirm'(el){
    if(!admGuard()) return;
    const o = STORE.orders.find(x=>x.id===el.dataset.id); if(!o) return;
    const wasDispute = o.orderStatus==='em_disputa';
    o.orderStatus = 'concluido'; o.paymentReleasedAt = new Date().toISOString(); o.paymentReleaseReason = 'decisao_admin';
    if(o.dispute){ o.dispute.status = 'encerrada'; o.dispute.resolution = 'liberado_vendedor'; o.dispute.resolvedAt = o.paymentReleasedAt; }
    admLog('pedido.liberar', 'pedido', o.id, money(admPayout(o))+(wasDispute?' · disputa decidida a favor do vendedor':''));
    closeModal(); saveState(); toast('Pagamento liberado ao vendedor.'); render();
  },
  'admin-order-refund'(el){
    if(!admGuard()) return;
    const o = STORE.orders.find(x=>x.id===el.dataset.id); if(!o) return;
    openModal(`<h3 style="font-size:20px;margin-bottom:6px;padding-right:30px">Reembolsar o comprador</h3>
      <p style="font-size:14px;color:var(--color-ink-muted);margin-bottom:16px">${money(admPaid(o))} voltam para o comprador e o vendedor não recebe o repasse do pedido ${o.id}.</p>
      <form data-form="admin-refund-order" data-id="${o.id}">
        <div class="field"><label for="adm-rnote">Justificativa da decisão</label><input class="input" id="adm-rnote" name="note" type="text" placeholder="Ex.: fotos confirmam que faltou o ferro 4" required></div>
        <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">Cancelar</button><button class="btn btn-primary btn-sm" type="submit">Reembolsar</button></div>
      </form>`);
  },
  'admin-report-resolve'(el){
    if(!admGuard()) return;
    const r = STORE.reports.find(x=>x.id===el.dataset.id); if(!r) return;
    const outcome = el.dataset.outcome, p = productById(r.productId);
    r.status = 'resolvida'; r.resolution = outcome; r.resolvedAt = new Date().toISOString();
    if(outcome==='anuncio_removido' && p){ admRemoveListing(p, r.reason); admLog('denuncia.remover_anuncio', 'anuncio', p.id, r.id+' · '+r.reason); }
    else admLog('denuncia.arquivar', 'denuncia', r.id, p ? p.brand+' '+p.model : '');
    saveState(); toast(outcome==='anuncio_removido'?'Anúncio removido e denúncia encerrada.':'Denúncia arquivada.'); render();
  },
});
Object.assign(FORM_HANDLERS, {
  'admin-search'(form){
    const {params} = parseHash(), p = new URLSearchParams(params.toString()), q = fv(form,'q').trim();
    if(q) p.set('q', q); else p.delete('q');
    const qs = p.toString(); go(form.dataset.base + (qs ? '?'+qs : ''));
  },
  'admin-remove-listing'(form){
    if(!admGuard()) return;
    const p = productById(form.dataset.id); if(!p) return;
    const reason = fv(form,'reason');
    admRemoveListing(p, reason); admLog('anuncio.remover', 'anuncio', p.id, reason);
    closeModal(); saveState(); toast('Anúncio removido.'); render();
  },
  'admin-suspend-user'(form){
    if(!admGuard()) return;
    const u = STORE.users.find(x=>x.id===form.dataset.id); if(!u) return;
    const reason = fv(form,'reason').trim(); if(!reason) return;
    u.status = 'suspenso'; u.suspendedReason = reason; u.suspendedAt = new Date().toISOString();
    let n = 0; STORE.products.forEach(p=>{ if(p.sellerId===u.id && p.status==='ativo'){ p.status='pausado'; p.pausedByAdmin=true; n++; } });
    admLog('usuario.suspender', 'usuario', u.id, reason+(n?` · ${n} anúncio${n>1?'s':''} pausado${n>1?'s':''}`:''));
    closeModal(); saveState(); toast('Conta suspensa.'); render();
  },
  'admin-refund-order'(form){
    if(!admGuard()) return;
    const o = STORE.orders.find(x=>x.id===form.dataset.id); if(!o) return;
    const note = fv(form,'note').trim(); if(!note) return;
    o.orderStatus = 'reembolsado'; o.refundedAt = new Date().toISOString();
    if(!o.dispute) o.dispute = {openedAt:o.refundedAt, reason:'Problema na entrega', text:'', status:'aberta', resolution:null};
    o.dispute.status = 'encerrada'; o.dispute.resolution = 'reembolsado'; o.dispute.note = note; o.dispute.resolvedAt = o.refundedAt;
    admLog('pedido.reembolsar', 'pedido', o.id, money(admPaid(o))+' · '+note);
    closeModal(); saveState(); toast('Comprador reembolsado.'); render();
  },
  'admin-order-note'(form){
    if(!admGuard()) return;
    const o = STORE.orders.find(x=>x.id===form.dataset.id); if(!o) return;
    const text = fv(form,'note').trim(); if(!text) return;
    o.adminNotes = o.adminNotes || [];
    o.adminNotes.push({at:new Date().toISOString(), adminId:STORE.currentUserId, text});
    admLog('pedido.nota', 'pedido', o.id, text.slice(0,80));
    saveState(); toast('Nota salva.'); render();
  },
  'admin-fee'(form){
    if(!admGuard()) return;
    const v = Number(fv(form,'fee'));
    if(!(v>=0 && v<=30)){ toast('Informe um percentual entre 0 e 30.'); return; }
    const old = STORE.settings.feeRate;
    // Freeze the old rate on existing orders so history does not change.
    STORE.orders.forEach(o=>{ if(o.feeRate==null) o.feeRate = old; });
    STORE.settings.feeRate = v/100;
    admLog('config.comissao', 'config', 'comissao', (old*100).toLocaleString('pt-BR')+'% → '+v.toLocaleString('pt-BR')+'%');
    saveState(); toast('Comissão atualizada para '+v.toLocaleString('pt-BR')+'%.'); render();
  },
});
// Links inside a dialog (account menu) close it when followed.
document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('a[data-close-modal]')) closeModal(); });

initStoreAsync();
