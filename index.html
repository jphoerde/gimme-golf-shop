function specRows(p){
  const rows = [];
  if(p.category==='taco'){
    rows.push(['Marca',p.brand],['Modelo',p.model],['Tipo',p.type]);
    if(p.setInfo) rows.push(['Composição do jogo', p.setInfo]);
    if(p.headCategory) rows.push(['Categoria da cabeça', p.headCategory]);
    if(p.loft) rows.push(['Loft', p.loft]);
    rows.push(['Mão', p.hand]);
    if(p.flex) rows.push(['Flex', p.flex]);
    rows.push(['Comprimento', p.length], ['Material da vara', p.shaftMaterial]);
    rows.push(['Estado da cabeça', p.headCondition], ['Estado da vara', p.shaftCondition], ['Estado do grip', p.gripCondition]);
    rows.push(['Headcover', p.headcover?'Sim, incluso':'Não incluso']);
    if(p.year) rows.push(['Ano', String(p.year)]);
    if(p.customizations) rows.push(['Customizações', p.customizations]);
  } else if(p.category==='bola'){
    rows.push(['Marca',p.brand],['Modelo',p.model],['Quantidade', p.quantity+' unidades'],['Estado de conservação', p.ballCondition],['Cor', p.color]);
  } else {
    rows.push(['Marca',p.brand],['Modelo',p.model],['Número/tamanho', String(p.size)],['Cor', p.color],['Estado de conservação', p.shoeCondition]);
  }
  return rows;
}
function scorecardBlock(p){
  return `<div class="scorecard">
    <div class="scorecard-title">Especificações</div>
    ${specRows(p).map(([l,v])=>`<div class="spec-row"><span class="spec-label">${l}</span><span class="spec-value">${escapeHtml(v)}</span></div>`).join('')}
  </div>`;
}

const LOCATIONS = ['Porto Alegre, RS','São Paulo, SP','Rio de Janeiro, RJ','Curitiba, PR','Belo Horizonte, MG','Florianópolis, SC'];
const SORT_OPTIONS = [
  ['relevancia','Relevância'], ['menor-preco','Menor preço'], ['maior-preco','Maior preço'],
  ['recentes','Mais recentes'], ['melhor-estado','Melhor estado'],
];
function conditionRank(p){
  if(p.category==='bola') return BALL_CONDITIONS.indexOf(p.condition);
  return CONDITION_LEVELS.indexOf(p.condition);
}
function matchesQuery(p,q){
  const hay = [p.brand,p.model,p.category,p.type,p.description].filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(term=>hay.includes(term));
}
function multiVals(params,key){ const v=params.get(key); return v? v.split(',').filter(Boolean) : []; }
function toggleParamHref(params,key,value){
  const p = new URLSearchParams(params.toString());
  const vals = multiVals(p,key);
  const i = vals.indexOf(value);
  if(i>=0) vals.splice(i,1); else vals.push(value);
  if(vals.length) p.set(key, vals.join(',')); else p.delete(key);
  return '#/busca?'+p.toString();
}
function setParamHref(params,key,value){
  const p = new URLSearchParams(params.toString());
  if(value===null||value==='') p.delete(key); else p.set(key,value);
  return '#/busca?'+p.toString();
}
function removeParamValueHref(params,key,value){
  const p = new URLSearchParams(params.toString());
  if(value===undefined){ p.delete(key); return '#/busca?'+p.toString(); }
  const vals = multiVals(p,key).filter(v=>v!==value);
  if(vals.length) p.set(key, vals.join(',')); else p.delete(key);
  return '#/busca?'+p.toString();
}

function filterAndSort(params){
  const cat = params.get('cat')||'';
  const q = (params.get('q')||'').trim();
  let list = STORE.products.filter(p=>p.status==='ativo');
  if(cat) list = list.filter(p=>p.category===cat);
  if(q) list = list.filter(p=>matchesQuery(p,q));

  const brand = multiVals(params,'brand'); if(brand.length) list = list.filter(p=>brand.includes(p.brand));
  const cond = multiVals(params,'condition'); if(cond.length) list = list.filter(p=>cond.includes(p.condition));
  const loc = multiVals(params,'loc'); if(loc.length) list = list.filter(p=>loc.includes(p.location));
  const seller = params.get('seller'); if(seller) list = list.filter(p=>p.sellerId===seller);
  const priceMin = params.get('priceMin'); if(priceMin) list = list.filter(p=>p.price>=Number(priceMin));
  const priceMax = params.get('priceMax'); if(priceMax) list = list.filter(p=>p.price<=Number(priceMax));

  if(cat==='taco'){
    const type = multiVals(params,'type'); if(type.length) list = list.filter(p=>type.includes(p.type));
    const hand = multiVals(params,'hand'); if(hand.length) list = list.filter(p=>hand.includes(p.hand));
    const flex = multiVals(params,'flex'); if(flex.length) list = list.filter(p=>flex.includes(p.flex));
    const length = multiVals(params,'length'); if(length.length) list = list.filter(p=>length.includes(p.length));
    const headCond = multiVals(params,'headCond'); if(headCond.length) list = list.filter(p=>headCond.includes(p.headCondition));
    const shaftCond = multiVals(params,'shaftCond'); if(shaftCond.length) list = list.filter(p=>shaftCond.includes(p.shaftCondition));
    const gripCond = multiVals(params,'gripCond'); if(gripCond.length) list = list.filter(p=>gripCond.includes(p.gripCondition));
  } else if(cat==='bola'){
    const qty = multiVals(params,'qty'); if(qty.length) list = list.filter(p=>qty.includes(String(p.quantity)));
  } else if(cat==='sapato'){
    const size = multiVals(params,'size'); if(size.length) list = list.filter(p=>size.includes(String(p.size)));
    const color = multiVals(params,'color'); if(color.length) list = list.filter(p=>color.includes(p.color));
  }

  const sort = params.get('sort')||'relevancia';
  list = list.slice();
  if(sort==='menor-preco') list.sort((a,b)=>a.price-b.price);
  else if(sort==='maior-preco') list.sort((a,b)=>b.price-a.price);
  else if(sort==='recentes') list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  else if(sort==='melhor-estado') list.sort((a,b)=>conditionRank(a)-conditionRank(b));
  else if(sort==='fitting' && STORE.fittingProfile){
    const scores = {};
    scoreAllTacosForProfile(STORE.fittingProfile).forEach(r=>{ scores[r.product.id] = r.score; });
    list.sort((a,b)=> (scores[b.id]!==undefined?scores[b.id]:-1) - (scores[a.id]!==undefined?scores[a.id]:-1));
  }
  else list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

  return list;
}

function facetOptions(baseList, key, getter){
  const counts = {};
  baseList.forEach(p=>{ const v=getter(p); if(v==null||v==='') return; counts[v]=(counts[v]||0)+1; });
  return Object.keys(counts).sort().map(v=>({value:v,count:counts[v]}));
}

function filterGroup(title, options, params, key, labelFn){
  if(!options.length) return '';
  const selected = multiVals(params,key);
  return `<div class="filter-group">
    <h4>${title}</h4>
    ${options.map(o=>`<a href="${toggleParamHref(params,key,o.value)}" class="filter-opt" style="text-decoration:none;color:inherit">
      <input type="checkbox" ${selected.includes(o.value)?'checked':''} tabindex="-1" onclick="return false">
      <span>${labelFn?labelFn(o.value):o.value}</span><span class="cnt">${o.count}</span>
    </a>`).join('')}
  </div>`;
}

function defaultDraftFor(kind){

  return {category:'sapato', brand:'', model:'', size:'', color:'', shoeCondition:'', description:'', price:'', offersAccepted:true, photoUploads:{}};
}
function finalizePhotoSet(draft){
  const uploads = draft.photoUploads || {};
  const up = photoLabelsFor(draft).filter(l=>uploads[l]);
  if(up.length) return {labels: up, photos: up.map(l=>`<span class="plate"><img src="${uploads[l]}" alt="${escapeHtml(l)}"></span>`)};
  return {labels: generatedLabelsFor(draft), photos: photosForProduct(draft)};
}
function finalizePhotos(draft){ return finalizePhotoSet(draft).photos; }
function readAndResizeImage(file, maxDim){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas=document.createElement('canvas'); canvas.width=w||1; canvas.height=h||1;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        try{ resolve(canvas.toDataURL('image/jpeg',0.72)); }catch(e){ reject(e); }
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function collectFormIntoDraft(form, draft){
  const fd = new FormData(form);
  for(const [k,v] of fd.entries()){ if(k==='dir') continue; draft[k]=v; }
  qsa('input[type=checkbox][name]', form).forEach(cb=>{ draft[cb.name] = cb.checked; });
}
function finalizeWizardProduct(kind, editId, status){
  const draft = WIZARD_DATA;
  const base = { ...draft, id: editId || nextId(kind==='taco'?'t':kind==='bola'?'b':'s'), category:kind, status, sellerId: STORE.currentUserId, price: Number(draft.price)||0 };
  base._brandColor = BRAND_COLOR[base.brand]||'#1B3B2C';
  if(kind==='taco'){ base.condition = base.headCondition; base.offersAccepted = draft.offersAccepted!==false; base.headcover = !!draft.headcover; base.year = draft.year? Number(draft.year): null; }
  if(kind==='bola'){ base.condition = base.ballCondition; base.quantity = Number(draft.quantity)||1; base.offersAccepted=false; }
  if(kind==='sapato'){ base.condition = base.shoeCondition; base.size = draft.size? Number(draft.size): null; base.offersAccepted = draft.offersAccepted!==false; }
  base.location = sellerLocation(base.sellerId);
  const photoSet = finalizePhotoSet(base);
  base.photoLabels = photoSet.labels;
  base.photos = photoSet.photos;
  if(!base.createdAt) base.createdAt = new Date().toISOString();
  const idx = STORE.products.findIndex(p=>p.id===base.id);
  if(idx>=0) STORE.products[idx] = base; else STORE.products.push(base);
  saveState();
  if(isRealUser(base.sellerId)){
    sb.from('products').upsert({
      id: base.id, seller_id: base.sellerId,
      status: base.status, price: base.price, data: base,
    }).then(({error})=>{ if(error) console.error('Supabase product sync:', error); });
  }
  WIZARD_KIND=null; WIZARD_DATA=null; WIZARD_EDIT_ID=null; WIZARD_STEP=1;
  return base;
}

/* ============================================================
   FITTING ONLINE
   A guided quiz that derives a recommended club spec profile, then ranks
   every active taco listing against it (nota de aderência). Mirrors the
   taco wizard's state/step idiom (module-level mutable state + a URL step
   param) but the step SEQUENCE is computed per-render from the user's
   tipo-de-taco choice (branching), not a fixed-length array like
   TACO_STEP_FNS — so the progress bar's "Etapa X de Y" always reflects the
   real number of steps for this session.
   ============================================================ */
let FITTING_STEP = null, FITTING_DATA = null;

const HANDICAP_BANDS = [
  {key:'abaixo_0', label:'Abaixo de 0'},
  {key:'0_9', label:'0 a 9'},
  {key:'10_18', label:'10 a 18'},
  {key:'19_25', label:'19 a 25'},
  {key:'acima_25', label:'Acima de 25'},
  {key:'sem_handicap', label:'Não tenho handicap'},
];
// "Não tenho handicap" is stored as its own band (so it highlights on its
// own card) but is treated exactly like "Acima de 25" by every derivation.
function handicapTier(data){ return data.handicapBand==='sem_handicap' ? 'acima_25' : (data.handicapBand||'10_18'); }

function defaultFittingData(){
  return {
    tipos: [], hand:'Destro', age:35, heightCm:175, heightUnit:'cm',
    handicapBand:'10_18',
    iron7Distance:140, iron7Unknown:false, distanceUnit:'m',
    ballFlightCurrent:'media', ballFlightCurrentUnknown:false,
    ballFlightDesired:'media', ballFlightDesiredUnknown:false,
    priority:0,
  };
}
function fittingIsPutterOnly(data){ return data.tipos.length===1 && data.tipos[0]==='putter'; }
// Putter-only shopping doesn't need the distance/ball-flight questions —
// those drive flex and loft/launch recommendations that don't meaningfully
// apply to a putter (per spec, putter-specific fitting is out of scope).
function fittingStepSequence(data){
  const steps = ['tipos','sobre','handicap'];
  if(!fittingIsPutterOnly(data)) steps.push('distancia','altura-bola');
  steps.push('prioridade');
  return steps;
}
function ensureFittingData(){
  if(!FITTING_DATA){
    FITTING_DATA = (STORE.fittingDraft && typeof STORE.fittingDraft==='object') ? {...defaultFittingData(), ...STORE.fittingDraft} : defaultFittingData();
  }
}
// Persisted on every step so a page reload never loses in-progress answers
// (unlike the taco/bola/sapato wizards, which only persist on publish).
function saveFittingDraft(){ STORE.fittingDraft = {...FITTING_DATA}; saveState(); }

function trajectorySvg(level, active){
  const curves = {baixa:'M4 30 Q 30 24, 60 28', media:'M4 30 Q 30 2, 60 28', alta:'M4 30 Q 20 -10, 60 28'};
  const color = active ? 'var(--color-primary)' : 'var(--color-border-strong)';
  return `<svg viewBox="-4 -16 68 50" fill="none"><path d="M2 30h58" stroke="var(--color-border)" stroke-width="1"/><path d="${curves[level]}" stroke="${color}" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="4" cy="30" r="2.4" fill="${color}"/></svg>`;
}
function trajCard(name, level, label, current){
  const active = current===level;
  return `<label class="traj-card ${active?'active':''}"><input type="radio" name="${name}" value="${level}" ${active?'checked':''}>${trajectorySvg(level,active)}<span>${label}</span></label>`;
}
function trajGroup(name, title, current){
  return `<div class="traj-group"><h4>${title}</h4><div class="traj-cards">
    ${trajCard(name,'baixa','Baixa',current)}
    ${trajCard(name,'media','Média',current)}
    ${trajCard(name,'alta','Alta',current)}
  </div></div>`;
}

/* ---------- step screens ---------- */
const FIT_TIPO_ART = {kit:['kit_a','sand'], ferro:['iron_a','mint'], driver:['driver_a','butter'], putter:['putter_a','blush']};
const FIT_STEP_ART = {
  tipos:['kit_a','sand','O que você procura'], sobre:['putter_b','blush','Sobre você'], handicap:['iron_a','mint','Seu nível'],
  distancia:['iron_c','sky','Sua distância'], 'altura-bola':['ball_tee','lilac','Seu voo de bola'], prioridade:['driver_b','butter','Sua prioridade'],
};
function fitStepTipos(data){
  const cards = FITTING_TIPOS.map(t=>{
    const checked = data.tipos.includes(t.key);
    const [img, plate] = FIT_TIPO_ART[t.key] || ['driver_a','butter'];
    return `<label class="radio-card ${checked?'active':''}"><input type="checkbox" name="tipos" value="${t.key}" data-onchange="fit-tipos-change" ${checked?'checked':''}><span class="pick-img" style="--plate:var(--plate-${plate})"><img src="${IMG(img)}" alt=""></span><span>${escapeHtml(t.label)}</span></label>`;
  }).join('');
  return `<h3 style="font-size:19px;margin-bottom:6px">Quais tacos você procura?</h3>
    <p class="hint" style="margin-bottom:18px">Selecione um ou mais. Isso ajusta as próximas perguntas ao que você realmente está buscando.</p>
    <div class="radio-cards pick-cards">${cards}</div>`;
}
function fitStepSobre(data){
  const totalIn = Math.round(data.heightCm/2.54);
  const ft = Math.floor(totalIn/12), inch = totalIn%12;
  const isFt = data.heightUnit==='ft';
  return `<h3 style="font-size:19px;margin-bottom:18px">Sobre você</h3>
    <div class="field"><label>Mão</label>${radioCards('hand', HANDS, data.hand)}</div>
    <div class="field" style="max-width:160px"><label>Idade</label><input class="input" type="number" name="age" min="8" max="99" value="${data.age}"></div>
    <div class="field">
      <label>Altura</label>
      <div class="chip-row" style="margin-bottom:10px">
        <label class="chip" style="position:relative"><input type="radio" name="heightUnit" value="cm" ${!isFt?'checked':''} style="position:absolute;opacity:0">cm</label>
        <label class="chip" style="position:relative"><input type="radio" name="heightUnit" value="ft" ${isFt?'checked':''} style="position:absolute;opacity:0">ft / in</label>
      </div>
      <div class="height-cm" style="max-width:160px"><input class="input" type="number" name="heightCm" min="120" max="220" value="${data.heightCm}" placeholder="cm"></div>
      <div class="height-ftin field-row" style="max-width:280px">
        <input class="input" type="number" name="heightFt" min="3" max="7" value="${ft}" placeholder="pés">
        <input class="input" type="number" name="heightIn" min="0" max="11" value="${inch}" placeholder="polegadas">
      </div>
    </div>`;
}
function fitStepHandicap(data){
  const cards = HANDICAP_BANDS.map(h=>{
    const active = data.handicapBand===h.key;
    return `<label class="radio-card ${active?'active':''}"><input type="radio" name="handicapBand" value="${h.key}" ${active?'checked':''}><span>${escapeHtml(h.label)}</span></label>`;
  }).join('');
  return `<h3 style="font-size:19px;margin-bottom:6px">Qual seu handicap?</h3>
    <p class="hint" style="margin-bottom:18px">Se não joga com handicap oficial, escolha a opção mais próxima do seu nível.</p>
    <div class="radio-cards">${cards}</div>`;
}
function fitStepDistancia(data){
  const unit = data.distanceUnit||'m';
  const isYd = unit==='yd';
  const meters = data.iron7Distance||140;
  const display = isYd ? Math.round(meters/0.9144) : meters;
  return `<h3 style="font-size:19px;margin-bottom:6px">Qual a distância do seu ferro 7?</h3>
    <p class="hint" style="margin-bottom:18px">A distância média que a bola percorre com o ferro 7, do tee até onde ela para.</p>
    <div class="slider-value" id="fit-distance-value">${display}<small>${isYd?'jardas':'metros'}</small></div>
    <input type="range" class="slider" name="iron7Distance" min="80" max="200" step="1" value="${meters}" data-oninput="fit-distance-input">
    <div class="slider-scale"><span>80 m</span><span>200 m</span></div>
    <div class="chip-row" style="justify-content:center;margin-top:16px">
      <label class="chip" style="position:relative"><input type="radio" name="distanceUnit" value="m" data-onchange="fit-distance-input" ${!isYd?'checked':''} style="position:absolute;opacity:0">Metros</label>

const FITTING_STEP_FNS = {
  tipos: fitStepTipos, sobre: fitStepSobre, handicap: fitStepHandicap,
  distancia: fitStepDistancia, 'altura-bola': fitStepAlturaBola, prioridade: fitStepPrioridade,

function fittingCollectStep(form, step, data){
  if(step==='tipos'){
    data.tipos = qsa('input[name="tipos"]:checked', form).map(el=>el.value);
  } else if(step==='sobre'){
    data.hand = fv(form,'hand')||data.hand;
    const ageN = Number(fv(form,'age')); if(ageN) data.age = ageN;
    const unit = fv(form,'heightUnit')||'cm';
    data.heightUnit = unit;
    if(unit==='ft'){
      const ft = Number(fv(form,'heightFt'))||0, inch = Number(fv(form,'heightIn'))||0;
      if(ft||inch) data.heightCm = Math.round((ft*12+inch)*2.54);
    } else {
      const cm = Number(fv(form,'heightCm')); if(cm) data.heightCm = cm;
    }
  } else if(step==='handicap'){
    data.handicapBand = fv(form,'handicapBand')||data.handicapBand;
  } else if(step==='distancia'){
    data.distanceUnit = fv(form,'distanceUnit')||data.distanceUnit||'m';
    const raw = Number(fv(form,'iron7Distance'));
    if(raw) data.iron7Distance = raw;
    data.iron7Unknown = !!(form.elements.namedItem('iron7Unknown') && form.elements.namedItem('iron7Unknown').checked);
  } else if(step==='altura-bola'){
    const cur = fv(form,'ballFlightCurrent'); if(cur) data.ballFlightCurrent = cur;
    const des = fv(form,'ballFlightDesired'); if(des) data.ballFlightDesired = des;
    data.ballFlightCurrentUnknown = !!(form.elements.namedItem('ballFlightCurrentUnknown') && form.elements.namedItem('ballFlightCurrentUnknown').checked);
    data.ballFlightDesiredUnknown = !!(form.elements.namedItem('ballFlightDesiredUnknown') && form.elements.namedItem('ballFlightDesiredUnknown').checked);
  } else if(step==='prioridade'){
    const raw = Number(fv(form,'priority'));
    if(!isNaN(raw)) data.priority = raw;
  }
}

/* ---------- v1 recommendation heuristic ---------- */
function fittingDeriveFlex(data){
  if(!data.iron7Unknown && data.iron7Distance){
    const d = data.iron7Distance;
    if(d<=110) return {flex:'Senior', why:`Seu ferro 7 percorre cerca de ${d} m, faixa típica de quem se beneficia de uma haste mais flexível (Senior).`};
    if(d<=135) return {flex:'Regular', why:`Seu ferro 7 percorre cerca de ${d} m, faixa típica de haste Regular.`};
    if(d<=155) return {flex:'Stiff', why:`Seu ferro 7 percorre cerca de ${d} m, faixa típica de quem se beneficia de haste Stiff.`};
    return {flex:'X-Stiff', why:`Seu ferro 7 percorre cerca de ${d} m, faixa típica de haste Extra Stiff.`};
  }
  const tier = handicapTier(data);
  if(data.age>=60 || tier==='acima_25') return {flex:'Senior', why:'Sem a distância do seu ferro 7, usamos sua idade e handicap: uma haste mais flexível tende a ajudar.'};
  return {flex:'Regular', why:'Sem a distância do seu ferro 7, usamos um ponto de partida seguro: haste Regular.'};
}
function fittingDeriveLength(data){
  const h = data.heightCm||175;
  if(h<=170) return {offset:-1, label:'Padrão −0,5"', why:`Com ${h} cm de altura, uma vara levemente mais curta costuma encaixar melhor.`};
  if(h<=183) return {offset:0, label:'Padrão', why:`Com ${h} cm de altura, o comprimento padrão de fábrica já tende a encaixar bem.`};
  if(h<=190) return {offset:1, label:'Padrão +0,5"', why:`Com ${h} cm de altura, meia polegada a mais no comprimento tende a ajudar.`};
  return {offset:2, label:'Padrão +1"', why:`Com ${h} cm de altura, uma vara mais longa tende a encaixar melhor.`};
}
function fittingDeriveHeadCategory(data){
  const tierIndex = {abaixo_0:3.4, '0_9':2.8, '10_18':2, '19_25':1, acima_25:0};
  const tier = handicapTier(data);
  let idx = tierIndex[tier]!==undefined ? tierIndex[tier] : 2;
  idx += (data.priority||0)/100*1.6;
  idx = Math.max(0, Math.min(HEAD_CATEGORY.length-1, Math.round(idx)));
  const cat = HEAD_CATEGORY[idx];
  const lean = (data.priority||0)<-10?'mais tolerância a erros':(data.priority||0)>10?'mais controle sobre a bola':'um equilíbrio entre os dois';
  return {category:cat, why:`Seu handicap e sua preferência por ${lean} apontam para cabeças ${cat}.`};
}
function fittingDeriveLoft(data){
  const levelIdx = {baixa:0, media:1, alta:2};
  const curKnown = !data.ballFlightCurrentUnknown, desKnown = !data.ballFlightDesiredUnknown;
  if(curKnown && desKnown && data.ballFlightCurrent!==data.ballFlightDesired){
    const cur = levelIdx[data.ballFlightCurrent], des = levelIdx[data.ballFlightDesired];
    if(des>cur) return {min:10.5, max:13, lancamento:'médio-alto', why:'Você quer uma bola mais alta do que tem hoje: mais loft e lançamento médio-alto ajudam a subir a trajetória.'};
    return {min:7.5, max:9, lancamento:'baixo', why:'Você quer uma bola mais baixa do que tem hoje: menos loft e lançamento baixo ajudam a reduzir a altura.'};
  }
  return {min:9, max:10.5, lancamento:'médio', why:'Sem uma preferência clara de altura de bola, uma faixa de loft neutra é o ponto de partida mais seguro.'};
}
function finalizeFittingProfile(){
  const data = FITTING_DATA;
  const flexR = fittingDeriveFlex(data);
  const lenR = fittingDeriveLength(data);
  const headR = fittingDeriveHeadCategory(data);
  const loftR = fittingDeriveLoft(data);
  STORE.fittingProfile = {
    tipos: [...data.tipos],
    hand: data.hand,
    flex: flexR.flex, flexWhy: flexR.why,
    lengthOffset: lenR.offset, lengthLabel: lenR.label, lengthWhy: lenR.why,
    headCategory: headR.category, headCategoryWhy: headR.why,
    loftMin: loftR.min, loftMax: loftR.max, lancamento: loftR.lancamento, loftWhy: loftR.why,
    computedAt: new Date().toISOString(),
  };
  STORE.fittingAlert = false;
  saveState();
}

/* ---------- nota de aderência (listing ranking) ---------- */
const STANDARD_LENGTH_IN = {Driver:45, Madeira:43, Híbrido:40.5, Wedge:35.5, Putter:34};
function parseListingLengthOffset(p){
  const raw = String(p.length||'').trim();
  if(!raw) return {offset:0, known:false};
  const padraoMatch = raw.match(/padr[aã]o\s*([+-]\s*[\d.,]+)?/i);
  if(padraoMatch){
    if(!padraoMatch[1]) return {offset:0, known:true};
    const n = parseFloat(padraoMatch[1].replace(/\s/g,'').replace(',','.'));
    return {offset: Math.round(n/0.5), known:true};
  }
  const inMatch = raw.match(/([\d.,]+)\s*"/);
  if(inMatch){
    const val = parseFloat(inMatch[1].replace(',','.'));
    const std = STANDARD_LENGTH_IN[p.type];
    if(std!=null) return {offset: Math.round((val-std)/0.5), known:true};
  }
  return {offset:0, known:false};
}
function flexDistance(a,b){
  const ia = FLEX_ORDER.indexOf(a), ib = FLEX_ORDER.indexOf(b);
  if(ia<0 || ib<0) return 2;
  return Math.abs(ia-ib);
}
function headCategoryDistance(a,b){
  const ia = HEAD_CATEGORY.indexOf(a), ib = HEAD_CATEGORY.indexOf(b);
  if(ia<0 || ib<0) return null;
  return Math.abs(ia-ib);
}
// Weights are intentionally gathered in one place (not scattered through the
// function) so they're easy to recalibrate later against real click/purchase
// data, per spec ("pesos devem ser configuráveis").
const FITTING_WEIGHTS = {flex:.35, head:.30, tipo:.20, length:.10, loft:.05};
function scoreListingAgainstProfile(p, profile){
  if(p.hand && profile.hand && p.hand!==profile.hand) return null; // mão: único filtro obrigatório

  let flexScore;
  if(!p.flex) flexScore = 0.6;
  else { const d = flexDistance(p.flex, profile.flex); flexScore = d===0?1:d===1?0.5:0; }

  let headScore;
  if(!p.headCategory) headScore = 0.5;
  else { const d = headCategoryDistance(p.headCategory, profile.headCategory); headScore = d===0?1:d===1?0.5:0; }

  const typeMatch = (profile.tipos||[]).some(key=>{ const t = FITTING_TIPOS.find(x=>x.key===key); return t && t.clubType===p.type; });
  const typeScore = typeMatch ? 1 : 0;

  const lenInfo = parseListingLengthOffset(p);
  let lengthScore, adjustableLength=false;
  if(!lenInfo.known) lengthScore = 0.6;
  else {
    const diff = Math.abs(lenInfo.offset - profile.lengthOffset);
    if(diff===0) lengthScore = 1;
    else { adjustableLength = true; lengthScore = diff===1 ? 0.7 : 0.6; } // comprimento é ajustável por um club builder — penalidade reduzida
  }

  let loftScore, adjustableLoft=false;
  if(p.type!=='Driver') loftScore = 1; // critério "Loft (drivers)" só se aplica a drivers
  else {
    const loftNum = p.loft!=null ? parseFloat(String(p.loft).replace(',','.')) : NaN;
    if(isNaN(loftNum)) loftScore = 0.6;
    else if(loftNum>=profile.loftMin && loftNum<=profile.loftMax) loftScore = 1;
    else { adjustableLoft = true; loftScore = 0.6; } // muitos drivers têm loft regulável no hosel — penalidade reduzida
  }

  const w = FITTING_WEIGHTS;
  const score = flexScore*w.flex + headScore*w.head + typeScore*w.tipo + lengthScore*w.length + loftScore*w.loft;
  return {product:p, score:Math.round(score*100), flexScore, headScore, typeScore, lengthScore, loftScore, adjustableLength, adjustableLoft};
}
function scoreAllTacosForProfile(profile){
  const list = STORE.products.filter(p=>p.category==='taco' && p.status==='ativo');
  return list.map(p=>scoreListingAgainstProfile(p, profile)).filter(Boolean).sort((a,b)=>b.score-a.score);
}
function fitDiffNote(r, profile){
  const losses = [
    {weight:FITTING_WEIGHTS.flex, score:r.flexScore, text: r.product.flex ? `Haste ${r.product.flex}, ${flexDistance(r.product.flex,profile.flex)>=2?'bem diferente':'um flex abaixo ou acima'} do sugerido (${profile.flex})` : 'Flex da haste não informado no anúncio'},
    {weight:FITTING_WEIGHTS.head, score:r.headScore, text: r.product.headCategory ? `Cabeça ${r.product.headCategory}, categoria diferente da sugerida (${profile.headCategory})` : 'Categoria da cabeça não informada no anúncio'},
    {weight:FITTING_WEIGHTS.tipo, score:r.typeScore, text: `Tipo ${r.product.type} fora da sua seleção de tacos`},
    {weight:FITTING_WEIGHTS.length, score:r.lengthScore, text: 'Comprimento diferente do sugerido'},
    {weight:FITTING_WEIGHTS.loft, score:r.loftScore, text: 'Loft fora da faixa sugerida'},
  ];
  losses.forEach(l=> l.lost = (1-l.score)*l.weight);
  losses.sort((a,b)=>b.lost-a.lost);
  return losses[0].lost>0.01 ? losses[0].text : '';
}
function fitAdjustableNote(r){
  const notes=[];
  if(r.adjustableLength) notes.push('comprimento');
  if(r.adjustableLoft) notes.push('loft');
  return notes.length ? `Ajustável por um club builder (${notes.join(' e ')})` : '';
}

// Used by viewSearch() in place of productGrid() so the fitting promo card
// (max once per page) and, when sorted by "Combina comigo", the per-card
// compatibility badge can be spliced in without touching productGrid()
// itself (which is reused on favorites/seller listings where neither applies).
function searchResultsGrid(list, opts){
  opts = opts||{};
  const cards = list.map(p=>{
    const sc = opts.scores ? opts.scores[p.id] : null;
    if(sc==null) return productCard(p);
    return `<div class="fit-pcard-wrap"><span class="fit-score-badge ${sc>=85?'ideal':sc>=60?'proximo':''}">${sc}% compatível</span>${productCard(p)}</div>`;
  });
  if(opts.showPromo) cards.splice(Math.min(2,cards.length), 0, fittingPromoCardHtml());
  if(!cards.length) return emptyState('inbox','Nenhum produto encontrado','Tente ajustar os filtros ou buscar por outro termo.');
  return `<div class="grid-products">${cards.join('')}</div>`;
}
function fitProductGrid(results, tier){
  if(!results.length) return '';
  const cards = results.map(r=>{
    const badgeCls = tier==='ideal'?'ideal':tier==='proximo'?'proximo':'';
    const badgeText = tier==='ideal' ? `Combina com você · ${r.score}%` : `${r.score}% compatível`;
    const diff = tier==='proximo' ? fitDiffNote(r, STORE.fittingProfile) : '';
    const adj = fitAdjustableNote(r);
    return `<div class="fit-pcard-wrap">
      <span class="fit-score-badge ${badgeCls}">${escapeHtml(badgeText)}</span>
      ${productCard(r.product)}
      ${diff?`<div class="fit-diff-note">${escapeHtml(diff)}</div>`:''}
      ${adj?`<div class="fit-adjustable-note">${icon('edit')}${escapeHtml(adj)}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="grid-products">${cards}</div>`;
}

/* ---------- progress bar + step shell ---------- */
function fitProgressHtml(stepName, data){
  const seq = fittingStepSequence(data);
  const idx = Math.max(0, seq.indexOf(stepName));
  const total = seq.length;
  // idx/total (not idx/(total-1)) so the ball only reaches the flag once the
  // LAST question is actually submitted — while answering it, it's still
  // visibly short of the hole.
  const pct = Math.round((idx/total)*100);
  return `<div class="fit-progress-wrap">
    <div class="fit-progress-track">
      <div class="fit-progress-fill" style="width:${pct}%"></div>
      <div class="fit-progress-ball" style="left:${pct}%">${icon('ballIcon')}</div>
    </div>
    <span class="fit-progress-flag">${icon('flag')}</span>
    <span class="fit-progress-label">Etapa ${idx+1} de ${total}</span>
  </div>`;
}

      ${ideais.length ? `<div class="fit-tier-head"><h3>Ideais para você</h3><p>Combinam de perto com o seu perfil recomendado.</p></div>${fitProductGrid(ideais,'ideal')}` : ''}

/* ============================================================
   TRACKING SERVICE — Correios integration abstraction
   ============================================================
   TrackingService is the contract the rest of the app depends on: given a
   tracking code, resolve the shipment's current status. The order model,
   checkout flow and seller/buyer UI below are written against this
   interface only — swapping the carrier, or adding a second one later
   (Melhor Envio, Jadlog...), means writing a new class that implements
   getStatus(); nothing else in the marketplace needs to change.
   ============================================================ */
class TrackingService {
  /**
   * @param {string} trackingCode
   * @param {object} [order] the order this code belongs to (context some
   *   implementations may need, e.g. to know when it was shipped)
   * @returns {Promise<{rawStatus:string, internalStatus:string|null, occurredAt:string, checkedAt:string}>}
   */
  async getStatus(trackingCode, order){ throw new Error('TrackingService.getStatus() não implementado.'); }
}

/*
  Real Correios integration point — intentionally NOT implemented.
  The official Correios tracking API (SRO / SIGEP Web) requires a contract
  number and credentials (usuário/senha or a partner token) that are not
  configured in this environment. When those credentials exist, replace the
  body of getStatus() below with the real HTTP call and feed its response
  through mapCorreiosEventToInternalStatus() — everything upstream (order
  lifecycle, buyer timeline, seller portal) already consumes exactly the
  shape TrackingService.getStatus() returns, so no other code needs to
  change to go live.
*/
class CorreiosTrackingService extends TrackingService {
  async getStatus(trackingCode, order){
    // Example of what a real implementation looks like, left unexecuted:
    //   const res = await fetch('https://api.correios.com.br/srorastro/v1/objetos/'+trackingCode, {
    //     headers: { Authorization: 'Bearer '+CORREIOS_API_TOKEN }
    //   });
    //   const data = await res.json();
    //   const evento = data.objetos[0].eventos[0];
    //   return {
    //     rawStatus: evento.descricao,
    //     internalStatus: mapCorreiosEventToInternalStatus(evento.descricao),
    //     occurredAt: evento.dtHrCriado,
    //     checkedAt: new Date().toISOString(),
    //   };
    throw new Error('Integração real dos Correios não configurada neste ambiente (sem credenciais/contrato). Use MockCorreiosTrackingService para a demonstração.');
  }
}

// Vocabulary Correios actually uses in tracking events, mapped to our
// internal enum. Kept standalone so the real service can reuse it unchanged.
// "Caso o status retornado pelos Correios não tenha correspondência clara,
// manter o último status conhecido" — returning null here is exactly that:
// callers keep the previous internalStatus and just record the raw text.
function mapCorreiosEventToInternalStatus(rawStatus){
  const s = normalizeCityKey(rawStatus);
  if(/objeto entregue/.test(s)) return TRACKING_STATUS.ENTREGUE;
  if(/saiu para entrega/.test(s)) return TRACKING_STATUS.SAIU_PARA_ENTREGA;
  if(/em transito|no transito|encaminhado/.test(s)) return TRACKING_STATUS.EM_TRANSITO;
  if(/objeto postado/.test(s)) return TRACKING_STATUS.ENVIADO;
  if(/tentativa de entrega|destinatario ausente|endereco incorreto|nao entregue|entrega nao efetuada/.test(s)) return TRACKING_STATUS.PROBLEMA_NA_ENTREGA;
  return null;
}

// The realistic Correios event text used by the mock, reused by the seller's
// "simular" shortcuts so forced statuses read the same as polled ones.
const MOCK_EVENT_TEXT = {
  ENVIADO: 'Objeto postado',
  EM_TRANSITO: 'Objeto em trânsito - por favor aguarde',
  SAIU_PARA_ENTREGA: 'Objeto saiu para entrega ao destinatário',
  ENTREGUE: 'Objeto entregue ao destinatário',
};
// How long (ms) after shippedAt each leg of the mock journey is reached.
// Deliberately short so a demo session can watch a shipment "arrive" live —
// via the periodic poll below — without waiting real days.
const MOCK_JOURNEY = [
  {afterMs: 0, status: TRACKING_STATUS.ENVIADO},
  {afterMs: 15000, status: TRACKING_STATUS.EM_TRANSITO},
  {afterMs: 35000, status: TRACKING_STATUS.SAIU_PARA_ENTREGA},
  {afterMs: 55000, status: TRACKING_STATUS.ENTREGUE},
];

/*
  Simulated Correios service. No network dependency: given an order's
  shippedAt, it derives the status a real query would plausibly return from
  how much time has elapsed — so both the periodic poll and a manual refresh
  are genuinely "asking the carrier" rather than the UI assuming progress.
  The order's _forceProblem flag (set by the seller's demo controls) is the
  one exception, since "problema na entrega" isn't something elapsed time
  can predict.
*/
class MockCorreiosTrackingService extends TrackingService {
  async getStatus(trackingCode, order){
    const checkedAt = new Date().toISOString();
    if(!order || !order.shippedAt){
      return {rawStatus:'Código não encontrado nos Correios', internalStatus:null, occurredAt:checkedAt, checkedAt};
    }
    if(order._forceProblem){
      return {rawStatus:'Tentativa de entrega não efetuada - destinatário ausente', internalStatus:TRACKING_STATUS.PROBLEMA_NA_ENTREGA, occurredAt:checkedAt, checkedAt};
    }
    const elapsedMs = Date.now() - new Date(order.shippedAt).getTime();
    let leg = MOCK_JOURNEY[0];
    for(const l of MOCK_JOURNEY){ if(elapsedMs>=l.afterMs) leg = l; }
    return {rawStatus: MOCK_EVENT_TEXT[leg.status], internalStatus: leg.status, occurredAt: checkedAt, checkedAt};
  }
}

// Single instance the rest of the app talks to. Swap for
// `new CorreiosTrackingService()` once real credentials are configured —
// every caller goes through this one line.
const trackingService = new MockCorreiosTrackingService();

/* ---------- order lifecycle helpers ---------- */
function normalizeCityKey(s){ return String(s==null?'':s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function sameCity(cityA, stateA, cityB, stateB){
  return normalizeCityKey(cityA)===normalizeCityKey(cityB) && normalizeCityKey(stateA)===normalizeCityKey(stateB);
}
function orderAddressFull(o){ return `${o.addressStreet} · ${o.addressCity}, ${o.addressState}`; }

function markOrderDelivered(order, occurredAt){
  order.deliveredAt = occurredAt || new Date().toISOString();
  order.orderStatus = 'protecao';
  order.protectionDeadline = new Date(new Date(order.deliveredAt).getTime()+PROTECTION_WINDOW_MS).toISOString();
}
function applyTrackingStatusToOrder(order, internalStatus, occurredAt){
  if(internalStatus===TRACKING_STATUS.ENVIADO){ if(order.orderStatus==='aguardando_envio') order.orderStatus='enviado'; }
  else if(internalStatus===TRACKING_STATUS.EM_TRANSITO){ order.orderStatus='em_transito'; }
  else if(internalStatus===TRACKING_STATUS.SAIU_PARA_ENTREGA){ order.orderStatus='saiu_para_entrega'; }
  else if(internalStatus===TRACKING_STATUS.ENTREGUE){ markOrderDelivered(order, occurredAt); }
  else if(internalStatus===TRACKING_STATUS.PROBLEMA_NA_ENTREGA){ order.orderStatus='problema_entrega'; }
}
// The single place that ever advances a Correios order's status. Always
// goes through trackingService — never assumes ENTREGUE just because a
// tracking code exists (per spec: "não assumir que foi entregue apenas
// porque o vendedor informou o tracking"). Returns whether anything changed.
async function pollTrackingForOrder(order){
  if(!order || order.deliveryMethod!=='correios' || !order.trackingCode) return false;
  if(order.trackingStatus===TRACKING_STATUS.ENTREGUE) return false;
  let result;
  try{
    result = await trackingService.getStatus(order.trackingCode, order);
  }catch(err){
    order.trackingError = err.message;
    saveState();
    return true;
  }
  order.trackingError = null;
  order.lastCheckedAt = result.checkedAt;
  let changed = false;
  if(result.rawStatus && result.rawStatus!==order.trackingRaw){ order.trackingRaw = result.rawStatus; changed = true; }
  if(result.internalStatus && result.internalStatus!==order.trackingStatus){
    order.trackingStatus = result.internalStatus;
    order.trackingHistory = order.trackingHistory || [];
    order.trackingHistory.push({status:result.internalStatus, rawStatus:result.rawStatus, at:result.occurredAt});
    applyTrackingStatusToOrder(order, result.internalStatus, result.occurredAt);
    changed = true;
  }
  saveState();
  return changed;
}
// Real-time fallback for the 48h auto-release (in case protectionDeadline is
// ever actually reached live); the seller/buyer "simular" button covers the
// case — the normal case in a short demo session — where nobody waits 48h.
function checkAutoRelease(order){
  if(order && order.orderStatus==='protecao' && order.protectionDeadline && Date.now()>=new Date(order.protectionDeadline).getTime()){
    order.orderStatus = 'concluido';
    order.paymentReleasedAt = new Date().toISOString();
    order.paymentReleaseReason = 'liberacao_automatica';
    saveState();
  }
}
function checkAllAutoReleases(){ (STORE.orders||[]).forEach(checkAutoRelease); }

/* ---------- periodic tracking poll (runs only while an in-flight
   Correios order's detail page is open) ---------- */
let _trackingPollTimer = null, _trackingPollOrderId = null;
function stopTrackingPoll(){ if(_trackingPollTimer){ clearInterval(_trackingPollTimer); _trackingPollTimer=null; _trackingPollOrderId=null; } }
function startTrackingPollFor(orderId){
  _trackingPollOrderId = orderId;
  _trackingPollTimer = setInterval(()=>{
    const o = STORE.orders.find(x=>x.id===orderId);
    if(!o){ stopTrackingPoll(); return; }
    pollTrackingForOrder(o).then(changed=>{
      if(changed){ checkAutoRelease(o); render(); }
    });
  }, 6000);
}
function maybeStartTrackingPoll(segments){
  let orderId = null;
  if(segments[0]==='compras' && segments[1]) orderId = segments[1];
  if(segments[0]==='vendedor' && segments[1]==='vendas' && segments[2]) orderId = segments[2];
  if(!orderId) return;
  const o = STORE.orders.find(x=>x.id===orderId);
  if(!o || o.deliveryMethod!=='correios' || !o.trackingCode || o.trackingStatus===TRACKING_STATUS.ENTREGUE) return;
  startTrackingPollFor(orderId);
}

function viewCheckout(productId, params){
  const p = productById(productId);
  if(!p || p.status!=='ativo') return viewNotFound();
  if(p.sellerId===STORE.currentUserId) return viewNotFound();
  const step = Math.min(4, Math.max(1, Number((params&&params.get('step'))||1)));
  if(CHECKOUT_PRODUCT_ID!==productId){
    CHECKOUT_PRODUCT_ID = productId;
    const user = currentUser();
    CHECKOUT_DATA = { address:{name:user.name, street:'', city:user.city, state:user.state, zip:''}, freight:'padrao', payment:'pix', card:{number:'',name:'',exp:'',cvv:''} };
  }
  const freight = FREIGHT_OPTIONS[CHECKOUT_DATA.freight].price;

function createOrderFromCheckout(p){
  const user = currentUser();
  const seller = sellerById(p.sellerId);
  const freight = FREIGHT_OPTIONS[CHECKOUT_DATA.freight].price;
  const addr = CHECKOUT_DATA.address;
  const eligibleLocal = sameCity(addr.city, addr.state, seller.city, seller.state);
  const order = {
    id: 'PED-'+Math.floor(10000+Math.random()*89999),
    productId: p.id, buyerId: user.id, sellerId: p.sellerId,
    price: p.price, freight, feeRate: STORE.settings ? STORE.settings.feeRate : 0.10,
    date: new Date().toISOString().slice(0,10),
    addressStreet: addr.street, addressCity: addr.city, addressState: addr.state, addressZip: addr.zip,
    payment: CHECKOUT_DATA.payment==='pix' ? 'PIX' : 'Cartão de crédito',
    // Same city → seller decides between Correios and a local/retirada
    // handoff; different cities → Correios is the only option (per spec).
    deliveryMethod: eligibleLocal ? null : 'correios',
    localEligible: eligibleLocal, localType: null,
    trackingCode: null, trackingStatus: null, trackingRaw: null, trackingHistory: [],
    shippedAt: null, deliveredAt: null, lastCheckedAt: null,
    protectionDeadline: null, paymentReleasedAt: null, paymentReleaseReason: null,
    orderStatus: 'aguardando_envio',
  };
  STORE.orders.push(order);
  const idx = STORE.products.findIndex(x=>x.id===p.id);
  if(idx>=0) STORE.products[idx].status = 'vendido';
  saveState();
  if(isRealUser(order.buyerId)){
    sb.from('orders').insert({
      id: order.id, product_id: order.productId,
      buyer_id: order.buyerId, seller_id: String(order.sellerId),
      data: order,
    }).then(({error})=>{ if(error) console.error('Supabase order sync:', error); });
    sb.from('products').update({status:'vendido', data:{...p, status:'vendido'}}).eq('id', p.id).then(()=>{});
  }
  CHECKOUT_PRODUCT_ID = null; CHECKOUT_DATA = null;
  return order;
}

  const idx = TIMELINE_INDEX[order.orderStatus] ?? 1;
  return `<div class="tracker">${TIMELINE_STEPS.map((s,i)=>{
    const cls = i<idx?'done':i===idx?'current':'';
    return `<div class="tracker-step ${cls}"><span class="dot"></span><span class="lbl">${s.label}</span></div>`;
  }).join('')}</div>`;
}

          </div>
        </div>
        <div style="text-align:right"><div class="mono" style="font-size:20px;font-weight:600">${money(total)}</div><div style="font-size:11.5px;color:var(--color-ink-muted)">${o.payment}</div></div>

      <div class="spec-row" style="padding-left:0;padding-right:0"><span class="spec-label">Total</span><span class="spec-value">${money(total)}</span></div>

/* ---------- delivery / tracking panel (seller shipping controls,
   buyer protection actions, Correios status display) ---------- */
function deliveryPanelHtml(o, role){
  const isSeller = role==='seller';

  if(o.orderStatus==='em_disputa'){
    return `<div class="card card-pad" style="margin-top:14px;background:var(--color-danger-soft);border:none">
      <div style="font-weight:700;color:var(--color-danger)">Pedido em disputa</div>
      <p style="font-size:12.5px;color:var(--color-ink-muted);margin-top:4px">${isSeller
        ? 'O comprador relatou um problema com este pedido. O pagamento permanece bloqueado até a resolução (fluxo de disputa fora do escopo deste protótipo).'
        : 'Você relatou um problema com este pedido. O pagamento do vendedor permanece bloqueado até a resolução (fluxo de disputa fora do escopo deste protótipo).'}</p>
    </div>`;
  }

  if(o.orderStatus==='concluido'){
    const reasonText = o.paymentReleaseReason==='confirmado_comprador' ? 'O comprador confirmou o recebimento.' : 'Liberado automaticamente após 48h sem contestação do comprador.';
    return `<div class="card card-pad" style="margin-top:14px;background:var(--color-success-soft);border:none">
      <div style="font-weight:700;color:var(--color-success)">${isSeller? 'Venda concluída, pagamento liberado.' : 'Compra concluída.'}</div>
      <p style="font-size:12.5px;color:var(--color-ink-muted);margin-top:4px">${reasonText}${o.paymentReleasedAt? ' · '+fmtDate(o.paymentReleasedAt) : ''}</p>
    </div>`;
  }

  if(o.orderStatus==='protecao'){
    const msLeft = o.protectionDeadline ? new Date(o.protectionDeadline).getTime()-Date.now() : 0;
    const hoursLeft = Math.max(0, Math.ceil(msLeft/3600000));
    if(isSeller){
      return `<div class="card card-pad" style="margin-top:14px;background:var(--color-success-soft);border:none">
        <div style="font-weight:700;color:var(--color-success)">Produto entregue ao comprador.</div>
        <p style="font-size:12.5px;color:var(--color-ink-muted);margin-top:4px">Entregue em ${fmtDate(o.deliveredAt)}. O comprador tem até ${hoursLeft}h para confirmar o recebimento antes da liberação automática do pagamento.</p>
      </div>`;
    }
    return `<div class="card card-pad" style="margin-top:14px;background:var(--color-success-soft);border:none">
      <div style="font-weight:700;color:var(--color-success)">Seu produto foi entregue.</div>
      <p style="font-size:12.5px;color:var(--color-ink-muted);margin:4px 0 14px">Você tem até 48h após a entrega para confirmar o recebimento. Restam aproximadamente ${hoursLeft}h.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" data-action="confirm-received" data-id="${o.id}">${icon('checkCircle')}Recebi e está tudo certo</button>
        <button class="btn btn-outline btn-sm" data-action="report-delivery-problem" data-id="${o.id}">Tenho um problema</button>
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--color-border)">
        <p class="hint" style="margin-bottom:8px">[Demo] Se nenhuma ação for tomada, o protótipo libera o pagamento automaticamente 48h após a entrega:</p>
        <button class="btn btn-outline btn-sm" data-action="simulate-auto-release" data-id="${o.id}">Simular passagem das 48h</button>
      </div>
    </div>`;
  }

  if(o.orderStatus==='problema_entrega'){
    return `<div class="card card-pad" style="margin-top:14px;background:var(--color-danger-soft);border:none">
      <div style="font-weight:700;color:var(--color-danger)">Problema na entrega</div>
      <p style="font-size:12.5px;color:var(--color-ink-muted);margin-top:4px">Os Correios reportaram uma tentativa de entrega não efetuada.${o.trackingRaw? ' "'+escapeHtml(o.trackingRaw)+'"' : ''}</p>
    </div>${correiosTrackingPanelHtml(o, isSeller)}`;
  }

  if(o.orderStatus==='aguardando_envio'){
    if(!isSeller){
      return `<div class="card card-pad" style="margin-top:14px;background:var(--color-accent-soft);border:none">
        <div style="font-weight:700;color:var(--color-accent-ink)">Aguardando envio</div>
        <p style="font-size:12.5px;color:var(--color-ink-muted);margin-top:4px">O vendedor ainda não despachou este pedido.</p>
      </div>`;
    }
    if(o.deliveryMethod===null){
      return `<div class="card card-pad" style="margin-top:14px">
        <div style="font-weight:700">Envie o produto ao comprador.</div>
        <p class="hint" style="margin-top:4px">Comprador e vendedor estão na mesma cidade. Escolha como este pedido será entregue.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-outline btn-sm" data-action="choose-local-delivery" data-id="${o.id}" data-kind="entrega">${icon('mapPin')}Entrega local</button>
          <button class="btn btn-outline btn-sm" data-action="choose-local-delivery" data-id="${o.id}" data-kind="retirada">${icon('box')}Retirada presencial</button>
          <button class="btn btn-outline btn-sm" data-action="choose-correios-delivery" data-id="${o.id}">${icon('truck')}Enviar pelos Correios</button>
        </div>
      </div>`;
    }
    if(o.deliveryMethod==='local'){
      return `<div class="card card-pad" style="margin-top:14px">
        <div style="font-weight:700">Envie o produto ao comprador.</div>
        <p class="hint" style="margin-top:4px">Combinado: ${o.localType==='retirada'?'retirada presencial':'entrega local'}. Confirme manualmente assim que o produto for entregue ao comprador.</p>
        <button class="btn btn-primary btn-sm" style="margin-top:12px" data-action="confirm-local-delivery" data-id="${o.id}">${icon('checkCircle')}Confirmar entrega</button>
      </div>`;
    }
    return `<div class="card card-pad" style="margin-top:14px">
      <div style="font-weight:700">Envie o produto ao comprador.</div>
      <p class="hint" style="margin-top:4px">Depois de postar nos Correios, informe o código de rastreamento.</p>
      <form data-form="add-tracking" data-order-id="${o.id}" style="margin-top:14px;max-width:340px">
        <div class="field"><label>Código de rastreamento dos Correios</label><input class="input mono" name="trackingCode" placeholder="AA123456789BR" required></div>
        <button class="btn btn-primary btn-sm" type="submit">Adicionar rastreamento</button>
      </form>
    </div>`;
  }

  // enviado / em_transito / saiu_para_entrega — Correios shipment in flight
  return correiosTrackingPanelHtml(o, isSeller);
}

function correiosTrackingPanelHtml(o, isSeller){
  if(o.deliveryMethod!=='correios' || !o.trackingCode) return '';
  const label = TRACKING_STATUS_LABEL[o.trackingStatus] || o.trackingStatus || '—';
  return `<div class="card card-pad" style="margin-top:14px">
    ${isSeller? `<div style="font-weight:700;margin-bottom:8px">Produto enviado</div>` : ''}
    <div class="spec-row" style="padding-left:0;padding-right:0"><span class="spec-label">Código</span><span class="spec-value mono">${escapeHtml(o.trackingCode)}</span></div>
    <div class="spec-row" style="padding-left:0;padding-right:0"><span class="spec-label">Status</span><span class="spec-value">${label}</span></div>
    ${o.trackingRaw? `<div class="spec-row" style="padding-left:0;padding-right:0"><span class="spec-label">Último evento</span><span class="spec-value" style="text-align:right;max-width:60%">${escapeHtml(o.trackingRaw)}</span></div>` : ''}
    <div class="spec-row" style="padding-left:0;padding-right:0"><span class="spec-label">Última consulta</span><span class="spec-value">${o.lastCheckedAt? timeAgo(o.lastCheckedAt) : '—'}</span></div>
    <button class="btn btn-outline btn-sm" style="margin-top:12px" data-action="poll-tracking-now" data-id="${o.id}">${icon('clock')}Atualizar status agora</button>
    ${isSeller? `<div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--color-border)">
      <p class="hint" style="margin-bottom:8px">[Demo] Simular resposta dos Correios:</p>

        <button class="btn btn-outline btn-sm" data-action="sim-tracking-status" data-id="${o.id}" data-status="EM_TRANSITO">Em trânsito</button>
        <button class="btn btn-outline btn-sm" data-action="sim-tracking-status" data-id="${o.id}" data-status="SAIU_PARA_ENTREGA">Saiu para entrega</button>
        <button class="btn btn-outline btn-sm" data-action="sim-tracking-status" data-id="${o.id}" data-status="ENTREGUE">Entregue</button>
        <button class="btn btn-danger-outline btn-sm" data-action="sim-tracking-problem" data-id="${o.id}">Problema na entrega</button>
      </div>
    </div>` : ''}
  </div>`;
}

function slugify(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function doLogin(userId, next){ STORE.currentUserId = userId; saveState(); go('#'+(next||'/')); }
/* Safe named-field access: HTMLFormElement's named-property getter is not
   implemented consistently everywhere, so read fields via .elements instead. */
function fv(form, name){ const el = form.elements.namedItem(name); if(!el) return ''; return 'value' in el ? (el.value||'') : ''; }

const FORM_HANDLERS = {
  'topsearch'(form){ const q=fv(form,'q').trim(); go('#/busca'+(q?('?q='+encodeURIComponent(q)):'')); },
  'listsearch'(form){ const {params}=parseHash(); const p=new URLSearchParams(params.toString()); const q=fv(form,'q').trim(); if(q) p.set('q',q); else p.delete('q'); go('#/busca?'+p.toString()); },
  'price-range'(form){ const {params}=parseHash(); const p=new URLSearchParams(params.toString()); const min=fv(form,'priceMin'), max=fv(form,'priceMax'); if(min) p.set('priceMin',min); else p.delete('priceMin'); if(max) p.set('priceMax',max); else p.delete('priceMax'); go('#/busca?'+p.toString()); },
  async 'login'(form){
    const email=fv(form,'email').trim(), password=fv(form,'password').trim();
    const next=form.dataset.next||'/';
    if(!email||!password){ toast('Preencha e-mail e senha.'); return; }
    const btn=form.querySelector('button[type=submit]');
    if(btn){ btn.disabled=true; btn.textContent='Entrando…'; }
    const {data, error}=await sb.auth.signInWithPassword({email, password});
    if(btn){ btn.disabled=false; btn.textContent='Entrar'; }
    if(error){ toast('E-mail ou senha incorretos.'); return; }
    await loadSupabaseUser(data.user);
    await Promise.all([loadUserOrders(), loadUserOffers(), loadUserFavorites()]);
    toast('Bem-vindo de volta, '+currentUser().name.split(' ')[0]+'!');
    go('#'+next);
  },
  async 'signup'(form){
    const name=fv(form,'fullName').trim(), email=fv(form,'email').trim(), password=fv(form,'password').trim();
    const city=fv(form,'city').trim(), state=fv(form,'state');
    if(!name||!email||!password||!city||!state){ toast('Preencha todos os campos obrigatórios.'); return; }
    const btn=form.querySelector('button[type=submit]');
    if(btn){ btn.disabled=true; btn.textContent='Criando conta…'; }
    const {data, error}=await sb.auth.signUp({email, password});
    if(btn){ btn.disabled=false; btn.textContent='Criar conta'; }
    if(error){ toast('Erro: '+error.message); return; }
    const colors=['#1B3B2C','#8A611A','#2F6B4F','#B3402A'];
    const profile={
      id: data.user.id, name, email, city, state, bio:'',
      rating:0, rating_count:0, sales_count:0, purchases_count:0,
      initials:initialsOf(name),
      color:colors[Math.floor(Math.random()*colors.length)],
      verified:false, joined:new Date().toISOString().slice(0,10),
    };
    const {error:pe}=await sb.from('profiles').insert(profile);
    if(pe){ toast('Erro ao criar perfil: '+pe.message); return; }
    await loadSupabaseUser(data.user);
    toast('Conta criada! Bem-vindo(a), '+name.split(' ')[0]+'.');
    go('#/perfil');
  },
  async 'edit-profile'(form){
    const user = currentUser();
    const idx = STORE.users.findIndex(u=>u.id===user.id);
    if(idx>=0){
      STORE.users[idx].name = fv(form,'fullName').trim()||user.name;
      STORE.users[idx].city = fv(form,'city').trim()||user.city;
      STORE.users[idx].state = fv(form,'state')||user.state;
      STORE.users[idx].bio = fv(form,'bio').trim();
      STORE.users[idx].initials = initialsOf(STORE.users[idx].name);
      saveState();
      if(isRealUser(user.id)){
        await sb.from('profiles').update({
          name: STORE.users[idx].name, city: STORE.users[idx].city,
          state: STORE.users[idx].state, bio: STORE.users[idx].bio,
          initials: STORE.users[idx].initials,
        }).eq('id', user.id);

    render();
  },
  'ask-question'(form){
    const pid = form.dataset.productId, text = fv(form,'question').trim();
    if(!text) return;
    if(!STORE.questions[pid]) STORE.questions[pid]=[];
    const user = currentUser();
    STORE.questions[pid].push({id:'q'+Date.now(), buyer:user.name, text, answer:null, date:new Date().toISOString().slice(0,10)});

    render();
  },
  'answer-question'(form){

    closeModal();
    toast('Contraproposta enviada ao comprador (simulado).');

  },
  'wizard-step'(form, e){
    const dir = e.submitter ? e.submitter.value : 'next';
    const kind = form.dataset.kind, editId = form.dataset.editId || null, step = Number(form.dataset.step);
    collectFormIntoDraft(form, WIZARD_DATA);
    if(dir==='back'){ go(`#/vendedor/cadastrar/${kind}${editId?'/'+editId:''}?step=${step-1}`); return; }
    if(dir==='next'){ go(`#/vendedor/cadastrar/${kind}${editId?'/'+editId:''}?step=${step+1}`); return; }
    if(dir==='draft'){ finalizeWizardProduct(kind, editId, 'rascunho'); toast('Rascunho salvo.'); go('#/vendedor/anuncios?status=rascunho'); return; }
    if(dir==='publish'){ const prod = finalizeWizardProduct(kind, editId, 'ativo'); toast('Anúncio publicado!'); go('#/produto/'+prod.id); return; }
  },
  'simple-listing'(form, e){
    const dir = e.submitter ? e.submitter.value : 'publish';
    const kind = form.dataset.kind, editId = form.dataset.editId || null;
    collectFormIntoDraft(form, WIZARD_DATA);
    const status = dir==='draft' ? 'rascunho' : 'ativo';
    const prod = finalizeWizardProduct(kind, editId, status);
    toast(status==='rascunho' ? 'Rascunho salvo.' : 'Anúncio publicado!');
    go(status==='rascunho' ? '#/vendedor/anuncios?status=rascunho' : '#/produto/'+prod.id);
  },
  'checkout-step'(form, e){
    const dir = e.submitter ? e.submitter.value : 'next';
    const step = Number(form.dataset.step), pid = form.dataset.productId, p = productById(pid);
    if(step===2) CHECKOUT_DATA.address = {name:fv(form,'fullName'), street:fv(form,'street'), city:fv(form,'city'), state:fv(form,'state'), zip:fv(form,'zip')};
    if(step===3) CHECKOUT_DATA.freight = fv(form,'freight') || CHECKOUT_DATA.freight;
    if(step===4){
      CHECKOUT_DATA.payment = fv(form,'payment') || CHECKOUT_DATA.payment;
      if(CHECKOUT_DATA.payment==='cartao'){
        CHECKOUT_DATA.card = { number:fv(form,'cardNumber'), name:fv(form,'cardName'), exp:fv(form,'cardExp'), cvv:fv(form,'cardCvv') };
      }
    }
    if(dir==='back'){ go(`#/checkout/${pid}?step=${step-1}`); return; }
    if(step<4){ go(`#/checkout/${pid}?step=${step+1}`); return; }
    const order = createOrderFromCheckout(p);
    toast('Compra realizada com sucesso!');
    go(`#/compras/${order.id}?success=1`);
  },
  'add-tracking'(form){
    const oid = form.dataset.orderId;
    const o = STORE.orders.find(x=>x.id===oid);
    const code = fv(form,'trackingCode').trim().toUpperCase();
    if(!o || !code){ toast('Informe o código de rastreamento dos Correios.'); return; }
    const now = new Date().toISOString();
    o.deliveryMethod = 'correios';
    o.trackingCode = code;
    o.shippedAt = now;
    o.trackingStatus = TRACKING_STATUS.ENVIADO;
    o.trackingRaw = MOCK_EVENT_TEXT.ENVIADO;
    o.trackingHistory = [{status:TRACKING_STATUS.ENVIADO, rawStatus:MOCK_EVENT_TEXT.ENVIADO, at:now}];
    o.lastCheckedAt = now;
    o.orderStatus = 'enviado';
    saveState();
    toast('Envio confirmado! O comprador já pode acompanhar a entrega.');
    render();
  },
  'fitting-step'(form, e){
    const dir = e.submitter ? e.submitter.value : 'next';
    const step = form.dataset.step;
    fittingCollectStep(form, step, FITTING_DATA);
    saveFittingDraft();
    const seq = fittingStepSequence(FITTING_DATA);
    let idx = seq.indexOf(step);
    if(idx<0) idx = 0;
    if(dir==='back'){
      if(idx>0) go('#/fitting?step='+seq[idx-1]); else go('#/');
      return;
    }
    if(idx>=seq.length-1){
      finalizeFittingProfile();
      // Small flourish on the still-live DOM before the full re-render swaps
      // in the results screen — the ball rolls to the flag and "falls in".
      const ball = qs('.fit-progress-ball');
      if(ball){
        ball.style.left = '100%';
        ball.classList.add('holed');
        setTimeout(()=>go('#/fitting?step=resultado'), 420);
        return;
      }
      go('#/fitting?step=resultado');
      return;
    }
    go('#/fitting?step='+seq[idx+1]);
  },
};

/* ============================================================
   GLOBAL EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', function(e){
  if(e.target.classList && e.target.classList.contains('modal-overlay')){ closeModal(); return; }
  if(e.target.closest('.modal-close')){ closeModal(); return; }

  const actionEl = e.target.closest('[data-action]');
  if(actionEl){
    const action = actionEl.getAttribute('data-action');
    const handler = ACTIONS[action];
    if(handler){ e.preventDefault(); handler(actionEl, e); }
    return;
  }
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ e.preventDefault(); go(navEl.getAttribute('data-nav')); return; }

  if(!e.target.closest('.modal-box') && !e.target.closest('[data-menu-toggle]')){
    // click elsewhere while account menu modal open is handled by overlay check above
  }
});

document.addEventListener('submit', function(e){
  const form = e.target;
  const kind = form.getAttribute('data-form');
  if(!kind) return;
  e.preventDefault();
  const handler = FORM_HANDLERS[kind];
  if(handler) handler(form, e);
});

document.addEventListener('change', function(e){
  const actionEl = e.target.closest('[data-action]');
  if(actionEl){
    const action = actionEl.getAttribute('data-action');
    if(CHANGE_ACTIONS[action]) CHANGE_ACTIONS[action](actionEl, e);
  }
  const onchangeEl = e.target.closest('[data-onchange]');
  if(onchangeEl){
    const action = onchangeEl.getAttribute('data-onchange');
    if(CHANGE_ACTIONS[action]) CHANGE_ACTIONS[action](onchangeEl, e);
  }
});

// Mirrors the 'change' delegation above but fires on every 'input' tick —
// needed for the fitting sliders' live number readout while dragging
// (native range inputs only fire 'change' on release).
document.addEventListener('input', function(e){
  const oninputEl = e.target.closest('[data-oninput]');
  if(oninputEl){
    const action = oninputEl.getAttribute('data-oninput');
    if(CHANGE_ACTIONS[action]) CHANGE_ACTIONS[action](oninputEl, e);
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal(); if(document.activeElement && document.activeElement.closest && document.activeElement.closest('.topbar')) document.activeElement.blur(); }
  if(e.key==='Enter' && e.target.matches && e.target.matches('[data-nav][tabindex], [data-menu-toggle][tabindex]')){ e.target.click(); }
});

/* ============================================================
   INTERACTIONS — golf-ball cursor, pointer parallax, mega menu
   ============================================================ */
const BallCursor = (function(){
  const fine = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!fine) return {refresh(){}};
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cur = document.createElement('div');
  cur.id = 'ballcur'; cur.setAttribute('aria-hidden','true');
  cur.innerHTML = '<span class="bc-ring"></span><span class="bc-ball"><i></i></span><span class="bc-label"></span>';
  document.body.appendChild(cur);
  const ball = cur.querySelector('.bc-ball'), label = cur.querySelector('.bc-label');
  const TEXTY = 'input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=submit]),textarea,select,[contenteditable="true"]';
  const LINKY = 'a,button,[data-nav],[data-action],[data-menu-toggle],label,summary,.chip,.tab,[role=button],input,.gallery-thumb,.photo-slot';
  let mx=-100, my=-100, tx=-100, ty=-100, x=-100, y=-100, rx=0, ry=0, raf=0, seen=false, holed=false, saidGimme=false;

  function frame(){
    raf = 0;
    const k = reduce ? 1 : .32;
    const nx = x+(tx-x)*k, ny = y+(ty-y)*k;
    rx += (nx-x)*.6; ry += (ny-y)*.6;       // the dimples roll with the distance travelled
    x = nx; y = ny;
    cur.style.transform = 'translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    ball.style.setProperty('--rx', rx.toFixed(1)+'px');
    ball.style.setProperty('--ry', ry.toFixed(1)+'px');
    if(Math.abs(tx-x)>.15 || Math.abs(ty-y)>.15) raf = requestAnimationFrame(frame);
  }
  function kick(){ if(!raf) raf = requestAnimationFrame(frame); }
  function setState(t){
    if(holed) return;
    let st = '', text = '';
    if(t && t.closest){
      if(t.closest(TEXTY)) st = 'is-hidden';
      else{
        const el = t.closest('[data-cursor],'+LINKY);
        if(el){
          if(el.hasAttribute('data-cursor')){ st='is-view'; text=el.getAttribute('data-cursor'); }
          else st = 'is-link';
        }
      }
    }
    cur.classList.toggle('is-hidden', st==='is-hidden');
    cur.classList.toggle('is-view', st==='is-view');
    cur.classList.toggle('is-link', st==='is-link');
    if(text) label.textContent = text;
  }
  function dropIn(cup){
    if(holed) return;
    holed = true;
    const r = cup.getBoundingClientRect();
    tx = r.left+r.width/2; ty = r.top+r.height/2; kick();
    cur.classList.remove('is-link','is-view','is-hidden');
    setTimeout(()=>cur.classList.add('is-holed'), 170);
    if(!saidGimme){ saidGimme = true; setTimeout(()=>toast('Essa é gimme. Bola dada!'), 520); }
    setTimeout(()=>{ cur.classList.remove('is-holed'); holed=false; tx=mx; ty=my; kick(); refresh(); }, 1250);
  }
  function refresh(){
    if(!seen) return;
    setState(document.elementFromPoint(mx, my));
  }
  document.addEventListener('mousemove', e=>{
    mx = e.clientX; my = e.clientY;
    if(!seen){ seen = true; x = tx = mx; y = ty = my; document.documentElement.classList.add('ballcursor'); cur.classList.add('on'); setState(e.target); }
    if(holed) return;
    tx = mx; ty = my; kick();
  }, {passive:true});
  document.addEventListener('mouseover', e=>{
    setState(e.target);
    const cup = e.target.closest && e.target.closest('[data-cup]');
    if(cup) dropIn(cup);
  }, {passive:true});
  document.addEventListener('mousedown', e=>{
    cur.classList.add('is-down');
    if(reduce) return;
    const d = document.createElement('span'); d.className = 'divot';
    d.style.left = e.clientX+'px'; d.style.top = e.clientY+'px';
    document.body.appendChild(d); setTimeout(()=>d.remove(), 600);
  }, {passive:true});
  document.addEventListener('mouseup', ()=>cur.classList.remove('is-down'), {passive:true});
  document.documentElement.addEventListener('mouseleave', ()=>cur.classList.remove('on'));
  document.documentElement.addEventListener('mouseenter', ()=>{ if(seen) cur.classList.add('on'); });
  return {refresh};
})();

/* pointer parallax: any [data-tilt] element gets --tx / --ty in [-1, 1] */
(function(){
  let tiltEl = null;
  document.addEventListener('mousemove', e=>{
    const t = e.target.closest ? e.target.closest('[data-tilt]') : null;
    if(tiltEl && tiltEl!==t){ tiltEl.style.removeProperty('--tx'); tiltEl.style.removeProperty('--ty'); }
    tiltEl = t;
    if(!t) return;
    const r = t.getBoundingClientRect();
    t.style.setProperty('--tx', (((e.clientX-r.left)/r.width)*2-1).toFixed(3));
    t.style.setProperty('--ty', (((e.clientY-r.top)/r.height)*2-1).toFixed(3));
  }, {passive:true});
})();

   ADMIN — painel do administrador do marketplace
   Rotas: #/admin, /pedidos(/:id), /anuncios, /usuarios(/:id),
   /moderacao, /financeiro, /auditoria. Acesso: user.role==='admin'.

   leitura vira um endpoint e cada ação grava no log de auditoria
   no servidor (ver a spec da área admin).
   ============================================================ */
const ADM_DAY = 86400000;
const ADM_OPEN = ['aguardando_envio','enviado','em_transito','saiu_para_entrega','entregue','protecao'];
const ADM_ISSUE = ['problema_entrega','em_disputa'];
const ADM_CAT_LABEL = {taco:'Tacos', bola:'Bolas', sapato:'Sapatos'};
const ADM_REMOVE_REASONS = ['Suspeita de falsificação','Descrição ou fotos não conferem','Item proibido','Anúncio duplicado','Pedido do vendedor'];
const ADM_LOG_LABEL = {
  'anuncio.pausar':'Pausou anúncio', 'anuncio.reativar':'Reativou anúncio', 'anuncio.remover':'Removeu anúncio',
  'usuario.verificar':'Verificou usuário', 'usuario.desverificar':'Removeu verificação', 'usuario.suspender':'Suspendeu usuário', 'usuario.reativar':'Reativou usuário',
  'pedido.liberar':'Liberou pagamento', 'pedido.reembolsar':'Reembolsou comprador', 'pedido.nota':'Anotou no pedido',
  'denuncia.arquivar':'Arquivou denúncia', 'denuncia.remover_anuncio':'Removeu anúncio denunciado',
  'config.comissao':'Alterou a comissão',
};

function isAdmin(){ const u = currentUser(); return !!u && u.role==='admin'; }
function admLog(action, targetType, targetId, detail){
  STORE.adminLog.unshift({id:'LOG-'+Date.now().toString(36)+Math.floor(Math.random()*90+10), at:new Date().toISOString(), adminId:STORE.currentUserId, action, targetType, targetId, detail:detail||''});
}

/* ---------- metric definitions (single source for every screen) ---------- */
function admDays(a, b){ return Math.max(0, Math.floor((new Date(b) - new Date(a)) / ADM_DAY)); }
function admSum(list, fn){ return list.reduce((t,x)=> t + fn(x), 0); }
function admMedian(nums){ if(!nums.length) return 0; const s=[...nums].sort((a,b)=>a-b), m=Math.floor(s.length/2); return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2); }
function admPct(part, total){ return total ? Math.round(part/total*100) : 0; }
// "Novo" = declared unused by the seller; every other condition counts as usado.
function admIsNew(p){ return p.condition==='Novo' || p.condition==='Novas'; }
function admSaleOrder(p){ return STORE.orders.find(o=>o.productId===p.id && o.orderStatus!=='reembolsado'); }
// Days on the shelf: until today for open listings, until the sale for sold ones.
function admListedDays(p){
  const sale = p.status==='vendido' ? admSaleOrder(p) : null;
  return admDays(p.createdAt, sale ? sale.date : new Date());
}
// Commission is charged on the item price only; freight is passed through to the seller.
function admFee(o){ const r = o.feeRate!=null ? o.feeRate : STORE.settings.feeRate; return Math.round(o.price*r*100)/100; }
function admPayout(o){ return o.price + o.freight - admFee(o); }
function admPaid(o){ return o.price + o.freight; }
function admCounts(o){ return o.orderStatus!=='reembolsado'; }           // counts toward GMV
function admHeld(o){ return o.orderStatus!=='concluido' && o.orderStatus!=='reembolsado'; } // money still in custody
function admOrdersSince(days){
  if(!days) return STORE.orders.slice();
  const cut = Date.now() - days*ADM_DAY;
  return STORE.orders.filter(o=> new Date(o.date).getTime() >= cut);
}
function admPeople(){ return STORE.users.filter(u=>u.role!=='admin'); }
function admUserStats(u){
  const listings = STORE.products.filter(p=>p.sellerId===u.id);
  const sales = STORE.orders.filter(o=>o.sellerId===u.id && admCounts(o));
  const buys = STORE.orders.filter(o=>o.buyerId===u.id && admCounts(o));
  return {listings, active:listings.filter(p=>p.status==='ativo').length, sales, buys,
    soldValue:admSum(sales,o=>o.price), boughtValue:admSum(buys,o=>o.price)};
}
function admUnanswered(){
  const out = [];
  Object.keys(STORE.questions).forEach(pid=>{
    const p = productById(pid);
    (STORE.questions[pid]||[]).forEach(q=>{ if(!q.answer && p) out.push({q, p, days:admDays(q.date, new Date())}); });
  });
  return out.sort((a,b)=>b.days-a.days);
}
function admOpenDisputes(){ return STORE.orders.filter(o=>ADM_ISSUE.includes(o.orderStatus)); }
function admOpenReports(){ return STORE.reports.filter(r=>r.status==='aberta'); }

function admMatch(q, ...fields){

}
