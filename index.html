<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gimme Golf Shop</title>
<meta name="description" content="Marketplace de equipamento de golfe usado, com ficha técnica completa, fitting online e pagamento protegido.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   GIMME GOLF SHOP — design tokens (v2)
   White studio ground, deep fairway ink, optic-yellow range-ball
   accent, and a set of pastel "paper" plates behind every product.
   ============================================================ */
:root{
  --color-bg:#FFFFFF;
  --color-surface:#FFFFFF;
  --color-surface-alt:#F2F5F0;
  --color-ink:#0D1F17;
  --color-ink-muted:#55645A;
  --color-ink-faint:#8A968D;
  --color-border:#E4E9E1;
  --color-border-strong:#C9D1C5;
  --color-primary:#0F5132;
  --color-primary-hover:#0A3B24;
  --color-primary-strong:#0A3B24;
  --color-primary-soft:#E3F1E8;
  --color-primary-ink:#FFFFFF;
  --color-accent:#DDF247;
  --color-accent-hover:#CDE52B;
  --color-accent-strong:#566A08;
  --color-accent-soft:#F3F9C6;
  --color-accent-ink:#2D3905;
  --color-on-accent:#17210A;
  --color-danger:#D2382E;
  --color-danger-soft:#FBE4E1;
  --color-success:#1C8552;
  --color-success-soft:#DEF3E7;
  --color-star:#EFA912;
  --color-night:#0B1C14;
  --color-on-night:#F1F5F0;
  --color-shadow:13,31,23;
  --plate-butter:#F8E78E;
  --plate-mint:#CDEBD6;
  --plate-sky:#CFE4F6;
  --plate-blush:#F9D7DB;
  --plate-lilac:#DFD8F6;
  --plate-peach:#FADDC8;
  --plate-sand:#EDE4D1;
  --font-display:'Bricolage Grotesque','Arial Narrow','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --radius-xl:32px;
  --container:1240px;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.3,1.5,.5,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --color-bg:#0A130F;
    --color-surface:#111D17;
    --color-surface-alt:#18271F;
    --color-ink:#EEF3EE;
    --color-ink-muted:#A5B3A9;
    --color-ink-faint:#74827A;
    --color-border:#223329;
    --color-border-strong:#34493D;
    --color-primary:#2A8257;
    --color-primary-hover:#339A68;
    --color-primary-strong:#A0DFBD;
    --color-primary-soft:#163423;
    --color-primary-ink:#FFFFFF;
    --color-accent:#DDF247;
    --color-accent-hover:#E9FA74;
    --color-accent-strong:#DDF247;
    --color-accent-soft:#2A3208;
    --color-accent-ink:#EAF7A0;
    --color-on-accent:#17210A;
    --color-danger:#F0776C;
    --color-danger-soft:#3B1B18;
    --color-success:#5CC592;
    --color-success-soft:#143524;
    --color-star:#F5C043;
    --color-night:#060D09;
    --color-on-night:#EEF3EE;
    --color-shadow:0,0,0;
    --plate-butter:#D9C766;
    --plate-mint:#9CCBAC;
    --plate-sky:#9DBEDC;
    --plate-blush:#DCA5AD;
    --plate-lilac:#B1A6DC;
    --plate-peach:#DDB193;
    --plate-sand:#C4B89B;
  }
}
:root[data-theme="dark"]{
  --color-bg:#0A130F;
  --color-surface:#111D17;
  --color-surface-alt:#18271F;
  --color-ink:#EEF3EE;
  --color-ink-muted:#A5B3A9;
  --color-ink-faint:#74827A;
  --color-border:#223329;
  --color-border-strong:#34493D;
  --color-primary:#2A8257;
  --color-primary-hover:#339A68;
  --color-primary-strong:#A0DFBD;
  --color-primary-soft:#163423;
  --color-primary-ink:#FFFFFF;
  --color-accent:#DDF247;
  --color-accent-hover:#E9FA74;
  --color-accent-strong:#DDF247;
  --color-accent-soft:#2A3208;
  --color-accent-ink:#EAF7A0;
  --color-on-accent:#17210A;
  --color-danger:#F0776C;
  --color-danger-soft:#3B1B18;
  --color-success:#5CC592;
  --color-success-soft:#143524;
  --color-star:#F5C043;
  --color-night:#060D09;
  --color-on-night:#EEF3EE;
  --color-shadow:0,0,0;
  --plate-butter:#D9C766;
  --plate-mint:#9CCBAC;
  --plate-sky:#9DBEDC;
  --plate-blush:#DCA5AD;
  --plate-lilac:#B1A6DC;
  --plate-peach:#DDB193;
  --plate-sand:#C4B89B;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%;display:block}
svg.icon{width:18px;height:18px;flex:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.02em;line-height:1.12}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
::selection{background:var(--color-accent);color:var(--color-on-accent)}
:focus-visible{outline:2px solid var(--color-ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-ink-muted)}

/* ---------- layout ---------- */
.wrap{max-width:var(--container);margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 16px}}
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1}
@media (max-width:900px){.main{padding-bottom:0}}

/* ---------- product imagery: a cut-out render on a paper plate ---------- */
.plate{display:block;width:100%;height:100%;background:var(--plate,var(--plate-mint));overflow:hidden}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.plate.flip img{transform:scaleX(-1)}

/* ---------- promo strip ---------- */
.promo{background:var(--color-night);color:var(--color-on-night);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;overflow:hidden;white-space:nowrap}
.promo-track{display:inline-flex;gap:0;padding:9px 0;animation:promo 38s linear infinite}
.promo:hover .promo-track{animation-play-state:paused}
.promo-track span{display:inline-flex;align-items:center;gap:22px;padding-right:22px}
.promo-track span::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--color-accent);flex:none}
@keyframes promo{to{transform:translateX(-50%)}}

/* ---------- header / nav ---------- */
.topbar{background:var(--color-surface);color:var(--color-ink);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--color-border)}
.topbar-row{display:flex;align-items:stretch;gap:20px;height:74px;position:static}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.045em;line-height:1;color:var(--color-ink);flex:none;cursor:pointer}
.brand-word{display:inline-flex;align-items:baseline;gap:3px}
.brand-ball{width:.23em;height:.23em;border-radius:50%;flex:none;display:inline-block;background:var(--color-accent);box-shadow:inset 0 0 0 1.5px var(--color-ink);transition:transform .6s var(--ease-spring)}
.brand:hover .brand-ball{transform:translateX(.42em)}
.brand small{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;color:var(--color-ink-muted);text-transform:uppercase;font-weight:500;line-height:1.25;padding-top:3px}
.nav-main{display:flex;align-items:stretch;justify-content:center;gap:2px;flex:1}
.nav-item{display:flex;align-items:stretch}
.nav-item>a{position:relative;display:flex;align-items:center;gap:5px;padding:0 13px;font-size:15px;font-weight:600;color:var(--color-ink);white-space:nowrap}
.nav-item>a::after{content:'';position:absolute;left:13px;right:13px;bottom:21px;height:2px;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .32s var(--ease-out)}
.nav-item>a::before{content:'';position:absolute;left:13px;bottom:18px;width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:inset 0 0 0 1.5px var(--color-ink);opacity:0;transition:left .42s var(--ease-out),opacity .15s;z-index:1}
.nav-item:hover>a::after,.nav-item:focus-within>a::after,.nav-item>a.active::after{transform:scaleX(1)}
.nav-item:hover>a::before,.nav-item:focus-within>a::before{left:calc(100% - 21px);opacity:1}
.nav-item>a svg{width:13px;height:13px;opacity:.55;transition:transform .25s}
.nav-item:hover>a svg{transform:rotate(180deg)}
.nav-actions{display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;cursor:pointer;position:relative;color:var(--color-ink);transition:background .2s,transform .25s var(--ease-spring)}
.icon-btn:hover{background:var(--color-surface-alt);transform:translateY(-1px)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .badge-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--color-danger);border:2px solid var(--color-surface)}
.btn-sell{display:inline-flex;align-items:center;gap:7px;background:var(--color-accent);color:var(--color-on-accent);font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:100px;border:none;cursor:pointer;white-space:nowrap;margin-left:6px;transition:background .2s,transform .25s var(--ease-spring)}
.btn-sell:hover{background:var(--color-accent-hover);transform:translateY(-1px) rotate(-1.5deg)}
.btn-sell svg{width:15px;height:15px}
.searchbar-desktop{align-self:center;display:flex;align-items:center;gap:8px;background:var(--color-surface-alt);border:1px solid transparent;border-radius:100px;padding:9px 14px;width:170px;transition:width .3s var(--ease-out),border-color .2s,background .2s;flex:none}
.searchbar-desktop:focus-within{width:260px;border-color:var(--color-ink);background:var(--color-surface)}
.searchbar-desktop input{background:none;border:none;outline:none;color:var(--color-ink);font-size:13.5px;width:100%;min-width:0}
.searchbar-desktop input::placeholder{color:var(--color-ink-faint)}
.searchbar-desktop svg{width:16px;height:16px;flex:none;color:var(--color-ink-muted)}
@media (max-width:1180px){.searchbar-desktop{display:none}}
@media (max-width:1000px){.nav-main{display:none}.topbar-row{justify-content:space-between}}
@media (max-width:640px){.topbar-row{height:60px}.btn-sell span{display:none}.btn-sell{padding:11px}.brand{font-size:25px}.brand small{display:none}}

/* mega panels */
.mega-panel{position:absolute;left:0;right:0;top:100%;background:var(--color-surface);border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);box-shadow:0 34px 60px -34px rgba(var(--color-shadow),.35);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s,transform .28s var(--ease-out),visibility 0s .2s;z-index:39}
.nav-item:hover>.mega-panel,.nav-item:focus-within>.mega-panel{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.topbar.mega-closed .mega-panel{display:none}
.mega-inner{max-width:var(--container);margin:0 auto;padding:30px 28px 36px;display:grid;grid-template-columns:1.25fr 1fr 1fr 300px;gap:36px;align-items:start}
.mega-inner.two{grid-template-columns:1.2fr 1fr 300px}
.mega-col h6{margin:0 0 12px;font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--color-ink-faint)}
.mega-col a{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px;font-weight:500;color:var(--color-ink);transition:transform .25s var(--ease-out),color .2s}
.mega-col a:hover{transform:translateX(6px);color:var(--color-primary)}
.mega-col a.big{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.02em;padding:4px 0}
.mega-col a.btn{display:inline-flex;padding:11px 18px;font-size:13.5px;font-weight:700;color:var(--color-primary-ink)}
.mega-col a.btn:hover{transform:translateY(-2px);color:var(--color-primary-ink)}
.mega-col a .cnt{font-family:var(--font-mono);font-size:11px;color:var(--color-ink-faint);font-weight:400}
.mega-col p{font-size:13.5px;color:var(--color-ink-muted);line-height:1.55;max-width:34ch;margin-bottom:14px}
.mega-feature{position:relative;display:block;border-radius:var(--radius-l);overflow:hidden;aspect-ratio:1/1;background:var(--plate,var(--plate-butter));transition:background .35s}
.mega-feature img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease-out),opacity .2s}
.mega-feature:hover img{transform:scale(1.06)}
.mega-feature .cap{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--color-surface);color:var(--color-ink);border-radius:100px;padding:9px 9px 9px 16px;font-size:13px;font-weight:600}
.mega-feature .cap i{width:28px;height:28px;border-radius:50%;background:var(--color-ink);color:var(--color-surface);display:flex;align-items:center;justify-content:center;flex:none}
.mega-feature .cap i svg{width:13px;height:13px}
.mega-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;grid-column:span 2}
.mega-step{background:var(--color-surface-alt);border-radius:var(--radius-m);padding:16px}
.mega-step b{display:block;font-family:var(--font-display);font-size:17px;margin:8px 0 4px;letter-spacing:-.01em}
.mega-step span{font-size:12.5px;color:var(--color-ink-muted);line-height:1.5;display:block}
.mega-step .mono{font-size:11px;color:var(--color-ink-faint);letter-spacing:.1em}

.avatar-chip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 10px 5px 5px;border-radius:100px}
.avatar-chip:hover{background:var(--color-surface-alt)}
.avatar-circle{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.avatar-circle.lg{width:64px;height:64px;font-size:22px}
.avatar-circle.xl{width:88px;height:88px;font-size:30px}

/* ---------- mobile bottom nav ---------- */
.mobilenav{display:none}
@media (max-width:900px){
  .mobilenav{display:flex;position:fixed;bottom:10px;left:10px;right:10px;background:var(--color-night);border-radius:100px;z-index:40;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .mobilenav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;color:rgba(241,245,240,.6);font-size:10px;font-weight:600;border-radius:100px}
  .mobilenav a.active{color:var(--color-on-accent);background:var(--color-accent)}
  .mobilenav svg{width:19px;height:19px}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;padding:14px 24px;border-radius:100px;border:1.5px solid transparent;cursor:pointer;line-height:1;transition:transform .25s var(--ease-spring),background .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--color-primary);color:var(--color-primary-ink)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-accent{background:var(--color-accent);color:var(--color-on-accent)}
.btn-accent:hover{background:var(--color-accent-hover)}
.btn-outline{background:transparent;border-color:var(--color-ink);color:var(--color-ink)}
.btn-outline:hover{background:var(--color-ink);color:var(--color-bg)}
.btn-ghost{background:transparent;color:var(--color-ink-muted)}
.btn-ghost:hover{background:var(--color-surface-alt);color:var(--color-ink)}
.btn-danger-outline{background:transparent;border-color:var(--color-danger);color:var(--color-danger)}
.btn-danger-outline:hover{background:var(--color-danger-soft)}
.btn-light{background:#fff;color:#0D1F17}
.btn-light:hover{background:var(--color-accent);color:var(--color-on-accent)}
.btn-block{width:100%}
.btn-sm{padding:9px 16px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px;transition:transform .25s var(--ease-out)}
.btn:hover svg:last-child{transform:translateX(3px)}

/* ---------- cards & surfaces ---------- */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-l)}
.card-pad{padding:24px}
.shadow-sm{box-shadow:0 1px 3px rgba(var(--color-shadow),.08)}
.shadow-md{box-shadow:0 6px 20px rgba(var(--color-shadow),.10)}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;letter-spacing:.06em;padding:5px 10px;border-radius:100px;text-transform:uppercase;font-family:var(--font-mono)}
.pill-active{background:var(--color-success-soft);color:var(--color-success)}
.pill-paused{background:var(--color-accent-soft);color:var(--color-accent-strong)}
.pill-sold{background:var(--color-ink);color:var(--color-bg)}
.pill-draft{background:var(--color-surface-alt);color:var(--color-ink-muted)}
.pill-cancelled{background:var(--color-danger-soft);color:var(--color-danger)}
.pill-neutral{background:var(--color-surface-alt);color:var(--color-ink-muted)}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- product card ---------- */
.grid-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 20px}
@media (max-width:560px){.grid-products{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}}
.pcard{background:transparent;border:none;border-radius:0;overflow:visible;cursor:pointer;display:flex;flex-direction:column}
.pcard-media{position:relative;aspect-ratio:1/1;border-radius:var(--radius-l);overflow:hidden;background:var(--color-surface-alt);isolation:isolate}
.pcard-media>.plate{position:absolute;inset:0;transition:opacity .35s}
.pcard-media>.plate img{transition:transform .7s var(--ease-out)}
.pcard-media>.plate.alt{opacity:0}
.pcard:hover .pcard-media>.plate img{transform:scale(1.07) translateY(-1.5%)}
.pcard:hover .pcard-media>.plate.flip img{transform:scaleX(-1) scale(1.07) translateY(-1.5%)}
.pcard:hover .pcard-media>.plate.alt{opacity:1}
.pcard-media svg{width:100%;height:100%}
.pcard-fav{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:transform .3s var(--ease-spring)}
.pcard-fav:hover{transform:scale(1.14)}
.pcard-fav svg{width:17px;height:17px;stroke:#0D1F17;fill:none}
.pcard-fav.active svg{fill:#D2382E;stroke:#D2382E}
.pcard-status{position:absolute;top:12px;left:12px;z-index:3}
.pcard-cta{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;justify-content:space-between;background:#fff;color:#0D1F17;border-radius:100px;padding:9px 9px 9px 16px;font-size:13px;font-weight:700;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .35s var(--ease-out);pointer-events:none}
.pcard-cta i{width:28px;height:28px;border-radius:50%;background:#0D1F17;color:#fff;display:flex;align-items:center;justify-content:center}
.pcard-cta i svg{width:13px;height:13px}
.pcard:hover .pcard-cta{opacity:1;transform:none}
@media (hover:none){.pcard-cta{display:none}}
.pcard-body{padding:14px 2px 0;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard-brand{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--color-ink-muted)}
.pcard-model{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.18;letter-spacing:-.015em}
.pcard-meta{font-size:13px;color:var(--color-ink-muted);margin-top:2px}
.pcard-condition{font-size:12.5px;color:var(--color-ink-muted)}
.pcard-condition b{color:var(--color-ink);font-weight:600}
.pcard-bottom{margin-top:auto;padding-top:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pcard-bottom>div{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;flex-wrap:wrap}
.pcard-price{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--color-ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pcard-loc{font-size:11.5px;color:var(--color-ink-faint);display:flex;align-items:center;gap:3px}
.pcard-loc svg{width:11px;height:11px}

/* ---------- section / page scaffolding ---------- */
.page-head{padding-top:38px;padding-bottom:22px}
.page-head h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.03em}
.section{padding-top:56px;padding-bottom:56px}
.section-tight{padding-top:26px;padding-bottom:26px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.section-head h2{font-size:clamp(28px,3.6vw,42px);letter-spacing:-.03em}
.section-head .link-more{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--color-ink);white-space:nowrap;border-bottom:2px solid var(--color-accent);padding-bottom:2px}
.section-head .link-more svg{width:15px;height:15px;transition:transform .25s var(--ease-out)}
.section-head .link-more:hover svg{transform:translateX(4px)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--color-ink-faint);margin-bottom:10px;flex-wrap:wrap}
.breadcrumb a:hover{color:var(--color-ink)}

/* ---------- hero ---------- */
.hero{position:relative;padding-top:22px}
.hero-card{position:relative;border-radius:var(--radius-xl);overflow:hidden;background:#13603A;color:#fff;min-height:540px;display:flex;align-items:center;isolation:isolate}
.hero-card>img.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:78% 50%;z-index:-2;transform:scale(1.03) translate(calc(var(--tx,0)*-8px),calc(var(--ty,0)*-6px));transition:transform .5s var(--ease-out)}
.hero-card::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(95deg,rgba(8,40,24,.82) 0%,rgba(8,40,24,.55) 38%,rgba(8,40,24,0) 66%)}
.hero-inner{position:relative;padding:54px 56px;max-width:720px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0D1F17;background:var(--color-accent);padding:7px 13px;border-radius:100px;margin-bottom:22px}
.hero-eyebrow svg{width:13px;height:13px}
.hero h1{font-size:clamp(46px,7.2vw,100px);line-height:.92;letter-spacing:-.03em;color:#fff;font-weight:800;font-stretch:84%}
.hero h1 em{font-style:normal;color:var(--color-accent)}
.hero p.lead{margin-top:20px;font-size:17.5px;color:rgba(255,255,255,.88);max-width:44ch;line-height:1.5}
.hero-ctas{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero-search{margin-top:26px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:100px;padding:5px;display:flex;gap:6px;max-width:460px;backdrop-filter:blur(6px);transition:background .2s,border-color .2s}
.hero-search:focus-within{background:rgba(255,255,255,.24);border-color:#fff}
.hero-search input{flex:1;background:none;border:none;outline:none;padding:10px 16px;color:#fff;font-size:14px;min-width:0}
.hero-search input::placeholder{color:rgba(255,255,255,.7)}
.hero-search button{border-radius:100px;padding:11px 13px}
.hero-examples{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero-examples span{font-size:12px;color:rgba(255,255,255,.7)}
.hero-examples a{font-size:12.5px;color:#fff;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:1px;transition:border-color .2s,color .2s}
.hero-examples a:hover{color:var(--color-accent);border-color:var(--color-accent)}
.hero-gloss{position:absolute;right:30px;bottom:26px;max-width:250px;font-size:12.5px;line-height:1.45;color:#fff;text-align:right;text-shadow:0 1px 10px rgba(8,40,24,.55)}
.hero-gloss b{font-family:var(--font-display);font-size:16px;color:#fff;letter-spacing:-.01em}
.hero-gloss i{font-style:normal;font-family:var(--font-mono);font-size:10.5px;opacity:.75}
.hero-badge{position:absolute;right:30px;top:28px;width:124px;height:124px;z-index:3;transition:transform .5s var(--ease-spring)}
.hero-badge svg{width:100%;height:100%;animation:spin 16s linear infinite}
.hero-badge:hover{transform:scale(1.12) rotate(-8deg)}
.hero-badge:hover svg{animation-duration:5s}
.hero-badge .core{position:absolute;inset:34px;border-radius:50%;background:#0D1F17;color:var(--color-accent);display:flex;align-items:center;justify-content:center}
.hero-badge .core svg{width:26px;height:26px;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:860px){
  .hero-card{min-height:0;align-items:flex-end;background:#0F3D27}
  .hero-card>img.hero-bg{inset:0 0 auto 0;height:280px;object-position:76% 50%}
  .hero-card::before{background:linear-gradient(180deg,rgba(15,61,39,0) 130px,#0F3D27 279px)}
  .hero-inner{padding:262px 22px 26px}
  .hero-gloss{display:none}
  .hero-badge{right:16px;top:16px;width:96px;height:96px}
  .hero-badge .core{inset:26px}
}

/* ---------- the three flows ---------- */
.flows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
@media (max-width:900px){.flows{grid-template-columns:1fr}}
.flow-card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;border-radius:var(--radius-xl);overflow:hidden;min-height:470px;padding:26px;background:var(--plate);color:#0D1F17;isolation:isolate;transition:transform .45s var(--ease-out)}
.flow-card:hover{transform:translateY(-6px)}
.flow-card img{position:absolute;left:0;top:-70px;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;z-index:-1;-webkit-mask-image:linear-gradient(#000 62%,transparent 88%);mask-image:linear-gradient(#000 62%,transparent 88%);transform:translate(calc(var(--tx,0)*-12px),calc(var(--ty,0)*-10px)) scale(1.02);transition:transform .5s var(--ease-out)}
.flow-card:hover img{transform:translate(calc(var(--tx,0)*-12px),calc(var(--ty,0)*-10px)) scale(1.1) rotate(calc(var(--tx,0)*-2deg))}
.flow-card .tag{position:absolute;top:22px;left:22px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:#0D1F17;color:#fff;padding:7px 12px;border-radius:100px}
.flow-card .go{position:absolute;top:18px;right:18px;width:46px;height:46px;border-radius:50%;background:#fff;color:#0D1F17;display:flex;align-items:center;justify-content:center;transition:transform .45s var(--ease-spring),background .25s}
.flow-card .go svg{width:18px;height:18px;transform:rotate(-45deg);transition:transform .35s var(--ease-out)}
.flow-card:hover .go{background:#0D1F17;color:var(--color-accent);transform:scale(1.12)}
.flow-card:hover .go svg{transform:rotate(0)}
.flow-card h3{font-size:clamp(26px,2.6vw,34px);letter-spacing:-.03em;max-width:13ch;font-weight:800}
.flow-card p{font-size:14px;line-height:1.5;margin-top:8px;max-width:30ch;color:rgba(13,31,23,.78)}
@media (max-width:900px){.flow-card{min-height:420px}.flow-card img{top:-90px;max-width:440px;left:50%;margin-left:-220px}}@media (max-width:480px){.flow-card img{left:0;margin-left:0;top:-60px}}

/* ---------- shop by type ---------- */
.type-row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.type-row{display:flex;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}.type-tile{flex:none;width:118px;scroll-snap-align:start}}
.type-tile{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.type-tile .disc{width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--plate);transition:border-radius .45s var(--ease-out),transform .45s var(--ease-spring)}
.type-tile .disc img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease-out)}
.type-tile:hover .disc{border-radius:30%;transform:translateY(-5px) rotate(-3deg)}
.type-tile:hover .disc img{transform:scale(1.14)}
.type-tile b{font-family:var(--font-display);font-size:16px;letter-spacing:-.01em;line-height:1.1}
.type-tile span{font-family:var(--font-mono);font-size:10.5px;color:var(--color-ink-faint);letter-spacing:.04em;margin-top:-6px}

/* ---------- category tiles (kept for compatibility) ---------- */
.cat-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}
@media (max-width:760px){.cat-grid{grid-template-columns:1fr}}
.cat-tile{position:relative;border-radius:var(--radius-l);overflow:hidden;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#0D1F17;background:var(--plate,var(--plate-mint));cursor:pointer;isolation:isolate}
.cat-tile h3{font-size:24px}

/* ---------- sell band ---------- */
.sell-band{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--radius-xl);overflow:hidden;background:var(--color-night);color:var(--color-on-night)}
@media (max-width:860px){.sell-band{grid-template-columns:1fr}}
.sell-band .sb-media{position:relative;background:var(--plate-butter);min-height:340px;overflow:hidden}
.sell-band .sb-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translate(calc(var(--tx,0)*-10px),calc(var(--ty,0)*-8px)) scale(1.04);transition:transform .5s var(--ease-out)}
.sell-band .sb-tagprice{position:absolute;left:22px;bottom:22px;background:#fff;color:#0D1F17;border-radius:var(--radius-m);padding:12px 16px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:rotate(-3deg);transition:transform .4s var(--ease-spring)}
.sell-band:hover .sb-tagprice{transform:rotate(2deg) translateY(-4px)}
.sell-band .sb-tagprice b{display:block;font-family:var(--font-display);font-size:22px;letter-spacing:-.02em}
.sell-band .sb-text{padding:48px 48px 44px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:860px){.sell-band .sb-text{padding:30px 22px}}
.sell-band .eyebrow{color:var(--color-accent)}
.sell-band h2{font-size:clamp(30px,3.8vw,50px);letter-spacing:-.035em;margin:10px 0 12px;font-weight:800}
.sell-band p{color:rgba(241,245,240,.76);font-size:15px;line-height:1.55;max-width:44ch}
.sell-steps{display:flex;flex-direction:column;margin:22px 0 26px;border-top:1px solid rgba(241,245,240,.16)}
.sell-steps li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(241,245,240,.16);font-size:14.5px;transition:padding-left .3s var(--ease-out)}
.sell-steps li:hover{padding-left:8px}
.sell-steps li .mono{color:var(--color-accent);font-size:11.5px;flex:none;width:22px}
.sell-steps li span:last-child{color:rgba(241,245,240,.7)}
.sell-steps li b{color:var(--color-on-night);font-weight:600}

/* ---------- trust row ---------- */
.trust-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border)}
@media (max-width:860px){.trust-row{grid-template-columns:1fr 1fr}}
.trust-cell{padding:26px 22px;border-right:1px solid var(--color-border);transition:background .3s}
.trust-cell:last-child{border-right:none}
@media (max-width:860px){.trust-cell:nth-child(2){border-right:none}.trust-cell:nth-child(-n+2){border-bottom:1px solid var(--color-border)}}
.trust-cell:hover{background:var(--color-surface-alt)}
.trust-cell svg{width:24px;height:24px;color:var(--color-primary);transition:transform .4s var(--ease-spring)}
.trust-cell:hover svg{transform:scale(1.2) rotate(-8deg)}
.trust-cell b{display:block;font-family:var(--font-display);font-size:18px;letter-spacing:-.015em;margin:12px 0 4px}
.trust-cell span{font-size:13px;color:var(--color-ink-muted);line-height:1.5;display:block}

/* ---------- filters / search page ---------- */
.search-layout{display:grid;grid-template-columns:250px 1fr;gap:36px;align-items:start}
@media (max-width:860px){.search-layout{grid-template-columns:1fr}}
.filters-panel{position:sticky;top:96px;display:flex;flex-direction:column;gap:22px}
@media (max-width:860px){.filters-panel{position:static;display:none}.filters-panel.open{display:flex}}
.filter-group{border-bottom:1px solid var(--color-border);padding-bottom:16px}
.filter-group:last-child{border-bottom:none}
.filter-group h4{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--color-ink-muted);margin-bottom:10px;font-family:var(--font-mono)}
.filter-opt{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;cursor:pointer}
.filter-opt input{width:16px;height:16px;accent-color:var(--color-primary);flex:none}
.filter-opt .cnt{margin-left:auto;color:var(--color-ink-faint);font-size:11.5px;font-family:var(--font-mono)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 14px;border-radius:100px;border:1px solid var(--color-border-strong);font-size:13px;font-weight:500;cursor:pointer;background:var(--color-surface);transition:border-color .2s,background .2s,color .2s,transform .25s var(--ease-spring)}
.chip:hover{border-color:var(--color-ink);transform:translateY(-1px)}
.chip.active{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-bg)}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input{width:100%;border:1px solid var(--color-border-strong);border-radius:var(--radius-s);padding:8px 10px;font-size:13px;background:var(--color-surface)}
.search-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.result-count{font-size:14.5px}
.result-count b{font-family:var(--font-mono)}
.select-native{border:1px solid var(--color-border-strong);border-radius:100px;padding:10px 16px;font-size:13.5px;background:var(--color-surface);cursor:pointer}
.mobile-filter-bar{display:none;gap:8px;margin-bottom:14px}
@media (max-width:860px){.mobile-filter-bar{display:flex}}
@media (max-width:860px){.search-toolbar .select-native{display:none}}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.active-filter-tag{display:flex;align-items:center;gap:6px;background:var(--color-primary-soft);color:var(--color-primary-strong);padding:6px 7px 6px 13px;border-radius:100px;font-size:12.5px;font-weight:600}
.active-filter-tag button{width:17px;height:17px;border-radius:50%;background:rgba(var(--color-shadow),.14);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:inherit}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12.5px;font-weight:700;color:var(--color-ink-muted)}
.field .hint{font-size:11.5px;color:var(--color-ink-faint)}
.input,select.input,textarea.input{border:1px solid var(--color-border-strong);border-radius:var(--radius-m);padding:13px 15px;font-size:14.5px;background:var(--color-surface);color:var(--color-ink);width:100%;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--color-ink);outline:none;box-shadow:0 0 0 3px var(--color-accent)}
textarea.input{resize:vertical;min-height:90px;font-family:var(--font-body)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
.field-error{border-color:var(--color-danger) !important}
.error-text{font-size:11.5px;color:var(--color-danger)}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.radio-card{border:1.5px solid var(--color-border-strong);border-radius:var(--radius-m);padding:14px 10px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:border-color .2s,background .2s,transform .25s var(--ease-spring)}
.radio-card:hover{border-color:var(--color-ink);transform:translateY(-2px)}
.radio-card svg{width:22px;height:22px}
.radio-card input{position:absolute;opacity:0;pointer-events:none}
.radio-card.active,.radio-card:has(input:checked){border-color:var(--color-primary);background:var(--color-primary-soft);color:var(--color-primary-strong)}
.condition-scale{display:flex;gap:6px;flex-wrap:wrap}
.condition-opt{flex:1;min-width:80px;border:1.5px solid var(--color-border-strong);border-radius:var(--radius-m);padding:11px 6px;text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;position:relative;transition:border-color .2s,background .2s}
.condition-opt:hover{border-color:var(--color-ink)}
.condition-opt input{position:absolute;opacity:0;pointer-events:none}
.condition-opt.active,.condition-opt:has(input:checked){border-color:var(--color-ink);background:var(--color-accent);color:var(--color-on-accent)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch{width:44px;height:26px;border-radius:100px;background:var(--color-border-strong);position:relative;cursor:pointer;flex:none;display:inline-block;transition:background .2s}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch.on,.switch:has(input:checked){background:var(--color-success)}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0,#f1f2ee 50%,#cfd4cc 100%);transition:left .25s var(--ease-spring)}
.switch.on .knob,.switch:has(input:checked) .knob{left:21px}

/* ---------- photo upload ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photo-slot{aspect-ratio:1;border-radius:var(--radius-m);border:1.5px dashed var(--color-border-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--color-ink-faint);text-align:center;padding:6px;position:relative;overflow:hidden;transition:border-color .2s,color .2s,background .2s}
.photo-slot:hover{border-color:var(--color-ink);color:var(--color-ink);background:var(--color-surface-alt)}
.photo-slot svg{width:20px;height:20px}
.photo-slot span{font-size:10px;font-weight:600;line-height:1.2}
.photo-slot.filled{border-style:solid;color:#fff}
.photo-slot.filled svg.check{position:absolute;top:6px;right:6px;width:16px;height:16px;background:var(--color-success);border-radius:50%;padding:3px;stroke:#fff}
.photo-slot .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(11,28,20,.66);color:#fff;font-size:9px;padding:4px 6px;text-align:left}

/* ---------- wizard ---------- */
.wizard-steps{display:flex;align-items:center;gap:4px;margin-bottom:26px;overflow-x:auto;padding-bottom:4px}
.wizard-step{display:flex;align-items:center;gap:8px;flex:none}
.wizard-step .num{width:28px;height:28px;border-radius:50%;background:var(--color-surface-alt);color:var(--color-ink-muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;font-family:var(--font-mono);flex:none}
.wizard-step.done .num{background:var(--color-success);color:#fff}
.wizard-step.current .num{background:var(--color-ink);color:var(--color-bg)}
.wizard-step .lbl{font-size:12.5px;font-weight:600;color:var(--color-ink-faint);white-space:nowrap}
.wizard-step.current .lbl{color:var(--color-ink)}
.wizard-connector{width:18px;height:1.5px;background:var(--color-border-strong);flex:none}
.wizard-actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--color-border)}

/* ---------- scorecard spec table ---------- */
.scorecard{border:1px solid var(--color-border);border-radius:var(--radius-l);overflow:hidden}
.scorecard-title{background:var(--color-night);color:var(--color-on-night);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:13px 20px}
.spec-row{display:flex;justify-content:space-between;gap:12px;padding:13px 20px;border-bottom:1px solid var(--color-border);font-size:14px}
.spec-row:last-child{border-bottom:none}
.spec-row:nth-child(even){background:var(--color-surface-alt)}
.spec-label{color:var(--color-ink-muted)}
.spec-value{font-weight:500;text-align:right;font-family:var(--font-mono)}

/* ---------- product gallery ---------- */
.gallery{display:grid;grid-template-columns:84px 1fr;gap:12px}
@media (max-width:640px){.gallery{grid-template-columns:1fr}}
.gallery-thumbs{display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.gallery-thumbs{flex-direction:row;overflow-x:auto;order:2}}
.gallery-thumb{width:100%;aspect-ratio:1;border-radius:var(--radius-m);overflow:hidden;border:2px solid transparent;cursor:pointer;flex:none;transition:transform .25s var(--ease-spring),border-color .2s}
.gallery-thumb:hover{transform:scale(1.05)}
@media (max-width:640px){.gallery-thumb{width:64px}}
.gallery-thumb.active{border-color:var(--color-ink)}
.gallery-mainwrap{min-width:0}
@media (max-width:640px){.gallery-mainwrap{order:1}}
.gallery-main{border-radius:var(--radius-xl);overflow:hidden;aspect-ratio:1/1;background:var(--color-surface-alt)}
.gallery-main .plate img{transition:transform .8s var(--ease-out)}
.gallery-main:hover .plate img{transform:scale(1.08)}
.gallery-main:hover .plate.flip img{transform:scaleX(-1) scale(1.08)}
.gallery-cap{margin-top:8px;font-size:12px;color:var(--color-ink-faint)}

/* ---------- product page ---------- */
.pdp-layout{display:grid;grid-template-columns:1fr .82fr;gap:52px;align-items:start}
@media (max-width:900px){.pdp-layout{grid-template-columns:1fr;gap:30px}}
.pdp-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pdp-title-row h1{font-size:clamp(28px,3.4vw,42px);letter-spacing:-.03em}
.pdp-price{font-family:var(--font-display);font-size:38px;font-weight:800;margin-top:8px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pdp-offer-note{font-size:12.5px;color:var(--color-ink-muted);margin-top:2px}
.pdp-quicktags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pdp-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.seller-card{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--color-border);border-radius:var(--radius-l);margin-top:22px;transition:border-color .2s,transform .3s var(--ease-out)}
.seller-card:hover{border-color:var(--color-ink);transform:translateY(-2px)}
.seller-card .info{flex:1;min-width:0}
.seller-card .name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:5px}
.seller-card .meta{font-size:12px;color:var(--color-ink-muted);margin-top:2px}
.stars{color:var(--color-star);font-size:13px;letter-spacing:1px}
.trust-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.trust-item{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--color-ink-muted)}
.trust-item svg{width:16px;height:16px;color:var(--color-success);flex:none}

/* ---------- Q&A ---------- */
.qa-item{padding:16px 0;border-bottom:1px solid var(--color-border)}
.qa-item:last-child{border-bottom:none}
.qa-q{display:flex;gap:10px}
.qa-a{display:flex;gap:10px;margin-top:10px;padding-left:38px}
.qa-bubble{background:var(--color-surface-alt);border-radius:var(--radius-m);padding:11px 15px;font-size:14px;flex:1}
.qa-bubble.seller{background:var(--color-primary-soft)}
.qa-meta{font-size:11px;color:var(--color-ink-faint);margin-top:4px}
.qa-name{font-weight:700;font-size:12.5px}
.qa-q>svg{width:28px;height:28px;flex:none;color:var(--color-ink-faint);background:var(--color-surface-alt);border-radius:50%;padding:6px;box-sizing:border-box}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--color-border);margin-bottom:22px;overflow-x:auto}
.tab{padding:12px 16px;font-size:14px;font-weight:600;color:var(--color-ink-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--color-ink)}
.tab.active{color:var(--color-ink);border-color:var(--color-ink)}
.tab .cnt{margin-left:6px;background:var(--color-surface-alt);padding:1px 7px;border-radius:100px;font-size:11px;font-family:var(--font-mono)}
.tab.active .cnt{background:var(--color-accent);color:var(--color-on-accent)}

/* ---------- dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:230px 1fr;gap:36px;align-items:start}
@media (max-width:860px){.dash-grid{grid-template-columns:1fr}}
.dash-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.dash-side{position:static}}
.dash-link{display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:100px;font-size:14px;font-weight:600;color:var(--color-ink-muted);transition:background .2s,color .2s,padding-left .25s var(--ease-out)}
.dash-link svg{width:17px;height:17px;flex:none}
.dash-link:hover{background:var(--color-surface-alt);color:var(--color-ink);padding-left:19px}
.dash-link.active{background:var(--color-ink);color:var(--color-bg)}
.dash-link .cnt{margin-left:auto;background:var(--color-danger);color:#fff;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:100px;font-family:var(--font-mono)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px}
.stat-tile{border:1px solid var(--color-border);border-radius:var(--radius-l);padding:18px 20px;background:var(--color-surface)}
.stat-tile .n{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat-tile .n.mono{font-family:var(--font-display)}
.stat-tile .l{font-size:12.5px;color:var(--color-ink-muted);margin-top:4px}

/* ---------- listing rows (meus anuncios / vendas / compras) ---------- */
.row-card{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--color-border);border-radius:var(--radius-l);margin-bottom:12px;flex-wrap:wrap;transition:border-color .2s}
.row-card:hover{border-color:var(--color-border-strong)}
.row-card .thumb{width:80px;height:80px;border-radius:var(--radius-m);overflow:hidden;flex:none;background:var(--color-surface-alt);display:block}
.row-card .info{flex:1;min-width:180px}
.row-card .title{font-weight:700;font-size:15px}
.row-card .sub{font-size:12.5px;color:var(--color-ink-muted);margin-top:3px}
.row-card .price{font-family:var(--font-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.row-card .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- order tracker ---------- */
.tracker{display:flex;justify-content:space-between;position:relative;margin:28px 0}
.tracker::before{content:'';position:absolute;top:13px;left:0;right:0;height:2px;background:var(--color-border)}
.tracker-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;text-align:center}
.tracker-step .dot{width:26px;height:26px;border-radius:50%;background:var(--color-surface);border:2px solid var(--color-border-strong);z-index:1}
.tracker-step.done .dot{background:var(--color-success);border-color:var(--color-success)}
.tracker-step.current .dot{background:var(--color-accent);border-color:var(--color-ink);box-shadow:0 0 0 4px var(--color-accent-soft)}
.tracker-step .lbl{font-size:10.5px;font-weight:600;color:var(--color-ink-faint);max-width:78px}
.tracker-step.done .lbl,.tracker-step.current .lbl{color:var(--color-ink)}

/* ---------- checkout ---------- */
.checkout-layout{display:grid;grid-template-columns:1fr .62fr;gap:36px;align-items:start}
@media (max-width:860px){.checkout-layout{grid-template-columns:1fr}}
.summary-line{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.summary-line.total{border-top:1px solid var(--color-border);margin-top:8px;padding-top:14px;font-weight:800;font-size:19px;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.pay-option{display:flex;align-items:center;gap:12px;border:1.5px solid var(--color-border-strong);border-radius:var(--radius-m);padding:15px;cursor:pointer;margin-bottom:10px;position:relative;transition:border-color .2s,background .2s}
.pay-option:hover{border-color:var(--color-ink)}
.pay-option input{position:absolute;opacity:0;pointer-events:none}
.pay-option.active,.pay-option:has(input:checked){border-color:var(--color-primary);background:var(--color-primary-soft)}
.pay-option svg{width:22px;height:22px;flex:none}
.payment-fields{display:none}
form:has(input[name="payment"][value="cartao"]:checked) .payment-fields[data-for="cartao"]{display:block}
form:has(input[name="payment"][value="pix"]:checked) .payment-fields[data-for="pix"]{display:block}
form:not(:has(input[name="payment"]:checked)) .payment-fields[data-for="pix"]{display:block}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(6,13,9,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadein .2s}
.modal-box{background:var(--color-surface);border-radius:var(--radius-xl);max-width:440px;width:100%;padding:28px;max-height:88vh;overflow-y:auto;animation:popin .32s var(--ease-spring)}
.modal-box h3{font-size:22px;margin-bottom:6px}
.modal-close{position:absolute;top:16px;right:16px}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{opacity:0;transform:translateY(14px) scale(.96)}}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--color-night);color:var(--color-on-night);padding:13px 20px 13px 14px;border-radius:100px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 14px 34px rgba(0,0,0,.28);display:flex;align-items:center;gap:10px;animation:toastin .4s var(--ease-spring);max-width:calc(100vw - 32px)}
@media (max-width:900px){.toast{bottom:92px}}
.toast svg{width:22px;height:22px;padding:4px;border-radius:50%;background:var(--color-accent);color:var(--color-on-accent);flex:none}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- empty state ---------- */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 20px;gap:14px;color:var(--color-ink-muted)}
.empty-state svg{width:52px;height:52px;color:var(--color-border-strong)}
.empty-state h3{font-size:22px;color:var(--color-ink)}
.empty-state p{font-size:14px;max-width:36ch}

/* ---------- footer ---------- */
.footer{background:var(--color-night);color:rgba(241,245,240,.7);padding:56px 0 0;margin-top:64px;overflow:hidden}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:28px}
@media (max-width:640px){.footer-grid{grid-template-columns:1fr 1fr}}
.footer .brand{color:var(--color-on-night)}
.footer .brand-ball{box-shadow:none}
.footer h5{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:rgba(241,245,240,.45);margin:0 0 14px;font-family:var(--font-mono)}
.footer a{display:block;width:fit-content;font-size:14px;padding:5px 0;color:rgba(241,245,240,.85);transition:color .2s,transform .25s var(--ease-out)}
.footer a:hover{color:var(--color-accent);transform:translateX(4px)}
.footer a.brand{display:flex;font-size:34px;padding:0;color:var(--color-on-night)}
.footer a.brand:hover{transform:none;color:var(--color-on-night)}
.footer .brand small{color:rgba(241,245,240,.55)}
.footer-bottom{margin-top:38px;padding-top:20px;border-top:1px solid rgba(241,245,240,.14);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer-bottom button{background:none;border:none;color:rgba(241,245,240,.6);text-decoration:underline;cursor:pointer;font-size:12px}
.footer-word{display:flex;align-items:flex-end;justify-content:center;gap:.06em;font-family:var(--font-display);font-weight:800;font-size:clamp(90px,25vw,360px);line-height:.74;letter-spacing:-.06em;color:var(--color-on-night);margin-top:34px;padding-bottom:.04em;user-select:none;white-space:nowrap}
@media (max-width:900px){.footer-word{padding-bottom:84px}}
.footer-word .cup{position:relative;width:.42em;height:.13em;border-radius:50%;background:#000;box-shadow:inset 0 .03em .05em rgba(255,255,255,.14);margin:0 0 .1em .04em;flex:none}
.footer-word .cup::before{content:'';position:absolute;left:50%;bottom:45%;width:.014em;min-width:2px;height:.62em;background:var(--color-on-night);transform:translateX(-50%)}
.footer-word .cup::after{content:'';position:absolute;left:calc(50% + .007em);bottom:calc(45% + .42em);border-left:.2em solid var(--color-accent);border-top:.075em solid transparent;border-bottom:.075em solid transparent;transform-origin:left center;transition:transform .5s var(--ease-spring)}
.footer-word .cup:hover::after{transform:rotate(-14deg) scaleX(1.12)}

/* ---------- login/cadastro ---------- */
.auth-shell{max-width:440px;margin:0 auto;padding:56px 20px}
.auth-shell .card{padding:32px;border-radius:var(--radius-xl)}
.auth-switch{text-align:center;margin-top:18px;font-size:14px;color:var(--color-ink-muted)}
.auth-switch a{color:var(--color-ink);font-weight:700;border-bottom:2px solid var(--color-accent)}
.divider-or{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--color-ink-faint);font-size:11px;text-transform:uppercase;font-family:var(--font-mono);letter-spacing:.1em}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--color-border)}

/* ---------- how it works ---------- */
.hiw-step{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid var(--color-border);transition:padding-left .3s var(--ease-out)}
.hiw-step:hover{padding-left:8px}
.hiw-step:last-child{border-bottom:none}
.hiw-num{font-family:var(--font-mono);font-size:13px;color:var(--color-ink-faint);flex:none;width:34px;padding-top:5px}
.hiw-step h3{font-size:21px;margin-bottom:6px}
.hiw-step p{font-size:14px;color:var(--color-ink-muted);max-width:56ch;line-height:1.6}

.skiplink{position:absolute;left:-999px;top:0}

/* ============================================================
   FITTING ONLINE — entry points, flow, results
   ============================================================ */
.fitting-banner{background:var(--plate-lilac);color:#0D1F17;border-radius:var(--radius-xl);padding:44px 48px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:28px;position:relative;overflow:hidden;isolation:isolate;min-height:400px}
.fitting-banner .fb-text{max-width:52ch;position:relative;z-index:2}
.fitting-banner .eyebrow{display:inline-flex;align-items:center;gap:7px;color:#fff;background:#0D1F17;padding:7px 12px;border-radius:100px}
.fitting-banner .eyebrow svg{width:13px;height:13px}
.fitting-banner h2{font-size:clamp(32px,4.4vw,60px);letter-spacing:-.04em;line-height:.96;margin:16px 0 14px;font-weight:800;color:#0D1F17}
.fitting-banner p{font-size:16px;color:rgba(13,31,23,.78);line-height:1.5;margin-bottom:22px;max-width:40ch}
.fitting-banner .btn-accent{background:#0D1F17;color:#fff}
.fitting-banner .btn-accent:hover{background:var(--color-accent);color:var(--color-on-accent)}
.fitting-banner .fb-visual{position:absolute;right:0;top:0;bottom:0;width:56%;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26%);mask-image:linear-gradient(90deg,transparent 0,#000 26%)}
.fitting-banner .fb-visual img{width:100%;height:100%;object-fit:cover;object-position:40% 40%;transform:translate(calc(var(--tx,0)*-12px),calc(var(--ty,0)*-8px)) scale(1.05);transition:transform .5s var(--ease-out)}
.fitting-banner .fb-facts{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.fitting-banner .fb-facts div{font-size:12.5px;color:rgba(13,31,23,.7);line-height:1.3}
.fitting-banner .fb-facts b{display:block;font-family:var(--font-display);font-size:26px;letter-spacing:-.03em;color:#0D1F17}
.fitting-banner.reminder{display:flex;justify-content:space-between;min-height:0;padding:18px 24px;flex-wrap:wrap;background:var(--color-accent)}
.fitting-banner.reminder .fb-text{display:flex;align-items:center;gap:12px;max-width:none}
.fitting-banner.reminder h2{font-size:18px;margin:0;letter-spacing:-.01em;line-height:1.2}
.fitting-banner.reminder .btn-outline{border-color:#0D1F17;color:#0D1F17}
.fitting-banner.reminder .btn-outline:hover{background:#0D1F17;color:#fff}
@media (max-width:860px){
  .fitting-banner{grid-template-columns:1fr;padding:26px 22px 250px;min-height:0}
  .fitting-banner .fb-visual{top:auto;height:250px;width:100%;-webkit-mask-image:linear-gradient(transparent 0,#000 30%);mask-image:linear-gradient(transparent 0,#000 30%)}
  .fitting-banner.reminder{padding:16px 18px}
}
.promo-fitting-card{background:var(--plate-lilac);border:none;border-radius:var(--radius-l);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;gap:8px;padding:22px 20px;cursor:pointer;color:#0D1F17;text-decoration:none;aspect-ratio:1/1;align-self:start;transition:transform .4s var(--ease-out),background .3s}
.promo-fitting-card:hover{transform:translateY(-4px) rotate(-1deg);background:var(--color-accent)}
.promo-fitting-card svg{width:34px;height:34px;padding:8px;border-radius:50%;background:#0D1F17;color:#fff;margin-bottom:auto}
.promo-fitting-card b{font-size:22px;font-family:var(--font-display);letter-spacing:-.02em;line-height:1.08}
.promo-fitting-card span{font-size:13px;color:rgba(13,31,23,.75)}
.link-skip{position:relative;display:inline-block;margin-top:10px;font-size:12.5px;color:var(--color-ink-faint);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.link-skip:hover{color:var(--color-ink-muted)}
.link-skip input{position:absolute;opacity:0;pointer-events:none}
.link-skip:has(input:checked){color:var(--color-primary);font-weight:700;text-decoration:none}
.chip:has(input:checked){background:var(--color-ink);border-color:var(--color-ink);color:var(--color-bg)}

/* progress bar: ball rolling toward the flag */
.fit-progress-wrap{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.fit-progress-track{position:relative;flex:1;height:8px;background:var(--color-surface-alt);border-radius:100px}
.fit-progress-fill{position:absolute;top:0;left:0;height:100%;background:var(--color-primary);border-radius:100px;transition:width .5s var(--ease-out)}
.fit-progress-ball{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0,#f1f2ee 50%,#c9cfc6 100%);border:1.5px solid var(--color-ink);transform:translate(-50%,-50%);transition:left .5s var(--ease-out);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(var(--color-shadow),.25);z-index:1}
.fit-progress-ball svg{width:13px;height:13px;color:#0D1F17}
.fit-progress-ball.holed{animation:fitholed .45s ease forwards}
@keyframes fitholed{to{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.fit-progress-flag{flex:none;width:24px;height:24px;color:var(--color-danger)}
.fit-progress-flag svg{width:100%;height:100%}
.fit-progress-label{font-family:var(--font-mono);font-size:11px;color:var(--color-ink-muted);white-space:nowrap;flex:none}
.fit-step-exit{text-align:center;margin-top:18px}

/* sliders */
.slider-value{font-family:var(--font-display);font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;text-align:center;color:var(--color-ink);margin-bottom:8px;font-variant-numeric:tabular-nums}
.slider-value small{display:block;font-size:11px;font-weight:500;color:var(--color-ink-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:10px;font-family:var(--font-mono)}
input[type=range].slider{width:100%;height:8px;border-radius:100px;background:var(--color-border);outline:none;-webkit-appearance:none;appearance:none;margin:14px 0;accent-color:var(--color-primary)}
input[type=range].slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0,#f1f2ee 50%,#c9cfc6 100%);border:1.5px solid var(--color-ink);box-shadow:0 3px 8px rgba(var(--color-shadow),.3);cursor:pointer}
input[type=range].slider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#f4f4f0;border:1.5px solid var(--color-ink);box-shadow:0 3px 8px rgba(var(--color-shadow),.3);cursor:pointer}
.slider-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--color-ink-faint);margin-top:2px;font-family:var(--font-mono)}
.slider-unit-toggle{display:flex;justify-content:center;gap:6px;margin-top:16px}
.priority-row{display:flex;align-items:flex-start;gap:16px;margin-top:8px}
.priority-pole{flex:none;width:130px;font-size:13px;font-weight:700;color:var(--color-ink);line-height:1.3}
.priority-pole small{display:block;font-weight:500;font-size:11px;color:var(--color-ink-faint);margin-top:3px}
.priority-pole.right{text-align:right}
.priority-track{flex:1;padding-top:4px}
.height-ftin{display:none}
form:has(input[name="heightUnit"][value="ft"]:checked) .height-cm{display:none}
form:has(input[name="heightUnit"][value="ft"]:checked) .height-ftin{display:flex}

/* trajectory illustration cards */
.traj-group{margin-bottom:22px}
.traj-group h4{font-size:15px;font-weight:700;margin-bottom:10px}
.traj-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.traj-card{border:1.5px solid var(--color-border-strong);border-radius:var(--radius-m);padding:10px 6px 8px;text-align:center;cursor:pointer;position:relative;transition:border-color .2s,background .2s,transform .25s var(--ease-spring)}
.traj-card:hover{border-color:var(--color-ink);transform:translateY(-2px)}
.traj-card input{position:absolute;opacity:0;pointer-events:none}
.traj-card svg{width:100%;height:34px;display:block}
.traj-card span{display:block;font-size:12px;font-weight:700;margin-top:2px}
.traj-card.active,.traj-card:has(input:checked){border-color:var(--color-primary);background:var(--color-primary-soft)}

/* results screen */

/* ---------- product imagery ----------
   Every listing shows a studio render cut out on transparency, sitting on one
   of seven pastel paper plates painted with CSS (so plates follow the theme).
   Files live next to the page in img/. */
const IMG = name => 'img/'+name+'.webp';
const PLATES = ['butter','mint','sky','blush','lilac','peach','sand'];
const ADDRESS = 'Vista de cima, no address';
const TACO_IMAGES = {
  'Driver':[['driver_a','Vista geral'],['driver_b',ADDRESS]],
  'Madeira':[['wood_a','Vista geral'],['wood_b',ADDRESS]],
  'Híbrido':[['hybrid_a','Vista geral'],['hybrid_b',ADDRESS]],
  'Ferro':[['iron_b','Jogo completo'],['iron_a','Cabeça e face'],['iron_c',ADDRESS]],
  'Wedge':[['wedge_a','Cabeça e face'],['wedge_b',ADDRESS]],
  'Putter':[['putter_a','Vista geral'],['putter_b',ADDRESS]],
  'Conjunto/Kit':[['kit_a','Conjunto completo'],['driver_a','Driver'],['iron_a','Ferros'],['putter_a','Putter']],
};
function plateFor(p){
  const s = String(p.id||p.model||p.brand||'gimme');
  let h = 7; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))>>>0;
  return PLATES[h % PLATES.length];
}
function imageSetFor(p){
  if(p.category==='taco') return TACO_IMAGES[p.type] || TACO_IMAGES['Driver'];
  if(p.category==='bola'){
    if(/amarel/i.test(p.color||'')) return [['balls_yellow','Dúzia'],['ball_tee','Detalhe da bola']];
    if(Number(p.quantity)>=24) return [['balls_pile','Lote completo'],['balls_white','Detalhe do lote'],['ball_solo','Detalhe dos dimples']];
    return [['balls_white','Dúzia'],['ball_tee','Detalhe da bola'],['ball_solo','Detalhe dos dimples']];
  }
  const c = (p.color||'').toLowerCase();
  const k = /marrom|caramelo|bege/.test(c) ? 'shoes_brown' : /^preto|cinza|grafite/.test(c) ? 'shoes_black' : 'shoes_white';
  return [[k,'Par completo']];
}
function plateHtml(name, plate, opts){
  opts = opts||{};
  return `<span class="plate${opts.flip?' flip':''}" style="--plate:var(--plate-${plate})"><img src="${IMG(name)}" alt="${escapeHtml(opts.alt||'')}" loading="lazy" decoding="async"></span>`;
}
function photosForProduct(p){
  const plate = plateFor(p), flip = p.category==='taco' && p.hand==='Canhoto';
  return imageSetFor(p).map(([n,label])=> plateHtml(n, plate, {flip, alt:label}));
}
function generatedLabelsFor(p){ return imageSetFor(p).map(x=>x[1]); }
function photoCaption(p, i){
  const label = (p.photoLabels && p.photoLabels[i]) || '';
  const uploaded = /src="data:/.test(p.photos[i]||'');
  return label + (uploaded ? ' · foto enviada pelo vendedor' : ' · imagem ilustrativa (render 3D) neste protótipo');
}

/* ============================================================
   SUPABASE — helpers
   ============================================================ */
function isRealUser(userId){
  return !!(userId && !SELLERS.find(s => s.id === userId));
}
function sbProfileToUser(p){
  return {
    id: p.id, name: p.name, email: p.email||'',
    city: p.city||'', state: p.state||'', bio: p.bio||'',
    rating: p.rating||0, ratingCount: p.rating_count||0,
    salesCount: p.sales_count||0, purchasesCount: p.purchases_count||0,
    initials: p.initials||initialsOf(p.name),
    color: p.color||'#1B3B2C', verified: p.verified||false,
    joined: p.joined||new Date().toISOString().slice(0,10),
  };
}
async function loadSupabaseUser(user){
  const {data: profile} = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(!profile) return false;
  const userObj = sbProfileToUser(profile);
  const idx = STORE.users.findIndex(u => u.id === profile.id);
  if(idx >= 0) STORE.users[idx] = userObj; else STORE.users.push(userObj);
  STORE.currentUserId = profile.id;
  saveState();
  return true;
}
async function loadSupabaseProducts(){
  const {data} = await sb.from('products').select('*');
  if(!data || !data.length) return;
  const sbIds = new Set(data.map(p => p.id));
  const demoProds = STORE.products.filter(p => !sbIds.has(p.id));
  STORE.products = [...data.map(p => ({...p.data, id: p.id, sellerId: p.seller_id, status: p.status, price: p.price})), ...demoProds];
}
async function loadUserOrders(){
  if(!STORE.currentUserId) return;
  const uid = STORE.currentUserId;
  const {data} = await sb.from('orders').select('*').or(`buyer_id.eq.${uid},seller_id.eq.${uid}`);
  if(!data || !data.length) return;
  const sbIds = new Set(data.map(o => o.id));
  const demoOrders = STORE.orders.filter(o => !sbIds.has(o.id));
  STORE.orders = [...data.map(o => o.data), ...demoOrders];
}
async function loadUserOffers(){
  if(!STORE.currentUserId) return;
  const uid = STORE.currentUserId;
  const {data} = await sb.from('offers').select('*').or(`buyer_id.eq.${uid},seller_id.eq.${uid}`);
  if(!data || !data.length) return;
  const sbIds = new Set(data.map(o => o.id));
  const demoOffers = STORE.offers.filter(o => !sbIds.has(o.id));
  STORE.offers = [...data.map(o => o.data), ...demoOffers];
}
async function loadUserFavorites(){
  if(!STORE.currentUserId) return;
  const {data} = await sb.from('favorites').select('product_id').eq('user_id', STORE.currentUserId);
  if(data){ STORE.favorites = data.map(f => f.product_id); saveState(); }
}
async function syncOfferToSupabase(offer, productId){
  if(!isRealUser(STORE.currentUserId)) return;
  const p = productById(productId);
  await sb.from('offers').upsert({
    id: offer.id, product_id: productId,
    buyer_id: offer.buyerId, seller_id: p ? p.sellerId : null,
    data: offer,
  });
}

/* ============================================================
   STORE — in-memory state + per-viewer localStorage persistence
   ============================================================ */
const STORE_KEY = 'ggs_state_v4';
let STORE = null;

function freshState(){
  const q = {};
  Object.keys(QUESTIONS).forEach(k=>{ q[k] = QUESTIONS[k].map(x=>({...x})); });
  return {
    currentUserId: null,
    favorites: [],
    products: ALL_PRODUCTS.map(p=>({...p, photos:[...p.photos]})),
    questions: q,
    offers: OFFERS.map(o=>({...o})),
    orders: buildSeedOrders(),
    users: [...SELLERS.map(s=>({...s})), ...buildExtraUsers()],
    reports: buildSeedReports(),
    adminLog: [],
    settings: {feeRate: 0.10},
    fittingDraft: null,
    fittingProfile: null,
    fittingAlert: false,
  };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }catch(e){ /* storage unavailable — continue in-memory */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.products)) return null;
    return parsed;
  }catch(e){ return null; }
}
function initStore(){
  STORE = loadState() || freshState();
  if(STORE.fittingDraft===undefined) STORE.fittingDraft = null;
  if(STORE.fittingProfile===undefined) STORE.fittingProfile = null;
  if(STORE.fittingAlert===undefined) STORE.fittingAlert = false;
  if(!STORE.reports) STORE.reports = buildSeedReports();
  if(!STORE.adminLog) STORE.adminLog = [];
  if(!STORE.settings) STORE.settings = {feeRate:0.10};
  STORE.users.forEach(u=>{ if(!u.role) u.role='user'; if(!u.status) u.status='ativo'; if(!u.email) u.email=u.id+'@exemplo.com'; });
  // Ensure admin user exists in demo data
  if(!STORE.users.find(u=>u.role==='admin')){
    const extras = buildExtraUsers();
    extras.forEach(u=>{ if(!STORE.users.find(x=>x.id===u.id)) STORE.users.push(u); });
  }
}
async function initStoreAsync(){
  // Fast path: render immediately with local/demo data
  initStore();
  render();
  // Slow path: sync with Supabase, re-render with live data
  try {
    sb.auth.onAuthStateChange(async (event, session) => {
      if(event === 'SIGNED_OUT'){ STORE.currentUserId = null; saveState(); render(); }
    });
    const {data: {session}} = await sb.auth.getSession();
    if(session) await loadSupabaseUser(session.user);
    await loadSupabaseProducts();
    if(STORE.currentUserId && isRealUser(STORE.currentUserId)){
      await Promise.all([loadUserOrders(), loadUserOffers(), loadUserFavorites()]);
    }
    render();
  } catch(e){ console.warn('Supabase unavailable, usando dados locais', e); }
}
function resetDemoData(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  location.hash = '#/';
  STORE = freshState();
  saveState();
  render();
  toast('Dados de demonstração reiniciados.');
}

function currentUser(){ return STORE.currentUserId ? sellerById(STORE.currentUserId) : null; }
function isLoggedIn(){ return !!STORE.currentUserId; }
function isFavorited(pid){ return STORE.favorites.includes(pid); }
function toggleFavorite(pid){
  if(!isLoggedIn()){ toast('Entre na sua conta para favoritar produtos.'); go('#/login?next='+encodeURIComponent(location.hash.slice(1)||'/')); return; }
  const i = STORE.favorites.indexOf(pid);
  if(i>=0){
    STORE.favorites.splice(i,1);
    if(isRealUser(STORE.currentUserId)){
      sb.from('favorites').delete().eq('user_id', STORE.currentUserId).eq('product_id', pid).then(()=>{});
    }
  } else {
    STORE.favorites.unshift(pid);
    if(isRealUser(STORE.currentUserId)){
      sb.from('favorites').insert({user_id: STORE.currentUserId, product_id: pid}).then(()=>{});
    }
  }
  saveState();
}
function questionsFor(pid){ return STORE.questions[pid] || []; }
function pendingQuestionsForSeller(sellerId){
  let n=0;
  Object.keys(STORE.questions).forEach(pid=>{
    const p = productById(pid);
    if(p && p.sellerId===sellerId){ STORE.questions[pid].forEach(q=>{ if(!q.answer) n++; }); }
  });
  return n;
}
function pendingOffersForSeller(sellerId){
  return STORE.offers.filter(o=>{ const p=productById(o.productId); return p && p.sellerId===sellerId && o.status==='pendente'; }).length;
}
function sellerListings(sellerId){ return STORE.products.filter(p=>p.sellerId===sellerId); }
function ordersAsBuyer(userId){ return STORE.orders.filter(o=>o.buyerId===userId).sort((a,b)=> b.date.localeCompare(a.date)); }
function ordersAsSeller(userId){ return STORE.orders.filter(o=>o.sellerId===userId).sort((a,b)=> b.date.localeCompare(a.date)); }

/* ============================================================
   UTILS
   ============================================================ */
function money(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateLong(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
}
function timeAgo(iso){
  const d = new Date(iso), now = new Date();
  const days = Math.floor((now-d)/86400000);
  if(days<=0) return 'hoje';
  if(days===1) return 'ontem';
  if(days<7) return days+' dias atrás';
  if(days<30) return Math.floor(days/7)+' semana(s) atrás';
  return Math.floor(days/30)+' mês(es) atrás';
}
function initialsOf(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function starString(rating){ const full=Math.round(rating); return '★★★★★'.slice(0,full)+'☆☆☆☆☆'.slice(0,5-full); }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function go(hash){ location.hash = hash; }

/* toast */
let __toastTimer=null;
function toast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast" role="status">${ICONS.flag}<span>${escapeHtml(msg)}</span></div>`;
  clearTimeout(__toastTimer);
  __toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 3200);
}

/* modal */
function openModal(innerHtml){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" data-close-modal>
    <div class="modal-box card" role="dialog" aria-modal="true">
      <button class="icon-btn modal-close" data-close-modal aria-label="Fechar">${ICONS.close}</button>
      ${innerHtml}
    </div>
  </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function confirmDialog(title, text, okLabel, action, dataAttrs){
  openModal(`<h3 style="font-size:20px;margin-bottom:8px;padding-right:30px">${title}</h3>
    <p style="font-size:14px;color:var(--color-ink-muted);margin-bottom:20px">${text}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" data-action="close-modal">Cancelar</button>
      <button class="btn btn-primary btn-sm" data-action="${action}" ${dataAttrs||''}>${okLabel}</button>
    </div>`);
}

const BRAND_HTML = `<span class="brand-word">gimme<i class="brand-ball"></i></span><small>golf<br>shop</small>`;

   ============================================================ */
const PROTECTED_PREFIXES = ['favoritos','compras','checkout','vendedor','perfil','admin'];

function parseHash(){
  let h = location.hash.slice(1) || '/';
  const qi = h.indexOf('?');
  let query = '';
  if(qi>=0){ query = h.slice(qi+1); h = h.slice(0,qi); }
  if(!h.startsWith('/')) h = '/'+h;
  const params = new URLSearchParams(query);
  const segments = h.split('/').filter(Boolean);
  return {path:h, segments, params};
}

function currentPathFull(){ return location.hash.slice(1) || '/'; }

function render(){
  const {path, segments, params} = parseHash();
  checkAllAutoReleases();
  stopTrackingPoll();

  if(segments.length && PROTECTED_PREFIXES.includes(segments[0]) && !isLoggedIn()){
    const isOwnProfileOrPublic = false;
    location.hash = '#/login?next='+encodeURIComponent(path);
    return;
  }

  const app = document.getElementById('app');
  let html = '';
  try{
    html = dispatch(segments, params);
  }catch(e){
    console.error(e);
    html = viewError();
  }
  app.innerHTML = html;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  renderTopbar();
  renderMobileNav();
  maybeStartTrackingPoll(segments);
  if(typeof BallCursor!=='undefined') requestAnimationFrame(BallCursor.refresh);
}

function dispatch(seg, params){
  if(seg.length===0) return viewHome();
  switch(seg[0]){
    case 'busca': return viewSearch(params);
    case 'produto': return seg[1] ? viewProduct(seg[1]) : viewNotFound();
    case 'loja': return seg[1] ? viewSellerPublic(seg[1]) : viewNotFound();
    case 'login': return viewLogin(params);
    case 'cadastro': return viewSignup();
    case 'perfil': return viewMyProfile();
    case 'favoritos': return viewFavorites();
    case 'como-funciona': return viewHowItWorks();
    case 'compras': return seg[1] ? viewOrderDetail(seg[1],'buyer',params) : viewMyPurchases();
    case 'checkout': return seg[1] ? viewCheckout(seg[1], params) : viewNotFound();
    case 'vendedor': return dispatchVendedor(seg, params);
    case 'fitting': return viewFitting(params);
    case 'admin': return dispatchAdmin(seg, params);
    default: return viewNotFound();
  }
}
function dispatchVendedor(seg, params){
  if(seg.length===1) return viewSellerDashboard();
  switch(seg[1]){
    case 'anuncios': return viewSellerListings(params);
    case 'cadastrar': return seg[2] ? viewWizard(seg[2], seg[3], params) : viewSellerCreatePick();
    case 'vendas': return seg[2] ? viewOrderDetail(seg[2],'seller',params) : viewSellerSales();
    case 'perguntas': return viewSellerQuestions();
    case 'ofertas': return viewSellerOffers();
    case 'perfil': return viewSellerProfileEdit();
    default: return viewNotFound();
  }
}

function pill(status){ return `<span class="pill ${LISTING_STATUS_PILL[status]||'pill-neutral'}">${LISTING_STATUS_LABEL[status]||status}</span>`; }

function conditionLine(p){
  if(p.category==='taco') return `Estado da cabeça: <b>${p.headCondition}</b>`;
  if(p.category==='bola') return `Estado: <b>${p.ballCondition}</b>`;
  return `Estado: <b>${p.shoeCondition}</b>`;
}
function metaLine(p){
  if(p.category==='taco'){
    const bits=[p.hand];
    if(p.flex) bits.push(p.flex);
    if(p.loft) bits.push(p.loft);
    return bits.filter(Boolean).join(' · ');
  }
  if(p.category==='bola') return `${p.quantity} unidades · ${p.color}`;
  return `Tam. ${p.size} · ${p.color}`;
}

  const alt = p.photos[1] ? p.photos[1].replace('class="plate', 'class="plate alt') : '';
  const name = p.model+(p.category==='taco'?' '+p.type:'');
  return `<article class="pcard" data-nav="#/produto/${p.id}" data-cursor="Ver" tabindex="0" role="link" aria-label="${escapeHtml(p.brand+' '+name)}">
    <div class="pcard-media">

      ${p.photos[0]}${alt}

    </div>
    <div class="pcard-body">
      <div class="pcard-brand">${p.brand}</div>
      <div class="pcard-model">${name}</div>
      <div class="pcard-meta">${metaLine(p)}</div>
      <div class="pcard-condition">${conditionLine(p)}</div>
